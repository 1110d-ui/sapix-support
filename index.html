                </div>
                <div style={{display:"flex",gap:5,marginBottom:8}}>
                  {[["next","2027年入試向け"],["past","過去の出題"],["all","すべて"]].map(([v,l])=>(
                    <button key={v} onClick={()=>setJijiTab(v)}
                      style={{flex:1,background:jijiTab===v?"rgba(96,165,250,.25)":"rgba(255,255,255,.05)",
                        border:jijiTab===v?"1px solid rgba(96,165,250,.55)":"1px solid rgba(255,255,255,.1)",
                        color:jijiTab===v?"#93c5fd":"rgba(255,255,255,.5)",borderRadius:7,padding:"6px 2px",fontSize:10.5,cursor:"pointer",fontFamily:"inherit"}}>{l}</button>
                  ))}
                </div>
                {list.map(x=>{
                  const on=!!checked[x.id];
                  return (
                    <div key={x.id} style={{display:"flex",gap:8,alignItems:"flex-start",padding:"6px 0",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
                      <button onClick={()=>toggle(x.id)} style={{flexShrink:0,width:20,height:20,borderRadius:5,marginTop:1,
                        border:on?"1px solid #4ade80":"1px solid rgba(255,255,255,.25)",background:on?"rgba(74,222,128,.25)":"transparent",
                        color:"#4ade80",fontSize:12,cursor:"pointer",padding:0}}>{on?"✓":""}</button>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:11,lineHeight:1.45,textDecoration:on?"line-through":"none",opacity:on?.55:1}}>
                          {x.subj&&<span style={{fontSize:9,padding:"0 4px",borderRadius:3,marginRight:5,background:x.subj==="理"?"rgba(34,197,94,.25)":"rgba(245,158,11,.25)",color:x.subj==="理"?"#4ade80":"#fbbf24"}}>{x.subj}</span>}
                          {x.text}
                        </div>
                        <div style={{fontSize:8.5,opacity:.45,marginTop:1}}>{x.cat==="past"?`${x.year}年度出題`:""}{x.note?`　${x.note}`:""}</div>
                      </div>
                      {x.custom&&<button onClick={()=>delCustom(x.id)} style={{flexShrink:0,background:"none",border:"none",color:"#f87171",fontSize:11,cursor:"pointer"}}>削除</button>}
                    </div>
                  );
                })}
                <div style={{display:"flex",gap:6,marginTop:8}}>
                  <input value={jijiInput} onChange={e=>setJijiInput(e.target.value)} placeholder="ニュース・用語を追加（例：2026年ノーベル賞◯◯）"
                    style={{flex:1,background:"rgba(255,255,255,.07)",border:"1px solid rgba(255,255,255,.15)",borderRadius:7,padding:"8px 10px",color:"white",fontSize:12,outline:"none",boxSizing:"border-box"}}/>
                  <button onClick={addCustom} disabled={!jijiInput.trim()}
                    style={{background:jijiInput.trim()?"rgba(59,130,246,.3)":"rgba(255,255,255,.05)",border:"1px solid rgba(96,165,250,.4)",color:jijiInput.trim()?"#93c5fd":"rgba(255,255,255,.3)",borderRadius:7,padding:"8px 12px",fontSize:12,cursor:"pointer",flexShrink:0,fontFamily:"inherit"}}>追加</button>
                </div>
              </div>
            )}
          </div>
        );
      })()}

      {YEARS.map(y=>{
        const tot=yTotal(y);
        const mn=parseFloat(yMin(y));
        const has=yHasAny(y);
        const pass=!isNaN(mn)&&has?tot>=mn:null;
        const yFullMax=CFG.subj.reduce((a,s)=>{const d=getSub(y,s.id);return a+(d?(parseFloat(d.max)||0):s.max);},0);
        return (
          <div key={y} style={{marginBottom:9,padding:"10px 11px",borderRadius:11,
            background:has?`${CFG.color}12`:"rgba(255,255,255,.035)",
            border:has?`1px solid ${CFG.color}3d`:"1px solid rgba(255,255,255,.07)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
              <span style={{fontSize:14,fontWeight:800}}>{y}年度</span>
              <span style={{fontSize:14,fontWeight:900,fontFamily:"monospace",
                color:pass===null?"rgba(255,255,255,.4)":pass?"#4ade80":"#f87171"}}>
                {has?`${tot} / ${yFullMax}`:"—"}
                {pass!==null&&<span style={{fontSize:10,marginLeft:5}}>({pass?"+":""}{tot-mn})</span>}
              </span>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5,marginBottom:6}}>
              {CFG.subj.map(s=>{
                const d=getSub(y,s.id);
                const c=SUBJ.find(x=>x.id===s.id).color;
                const st=subTotal(y,s.id);
                const smx=d?(parseFloat(d.max)||0):s.max;
                const sp=d&&smx?Math.round(st/smx*100):null;
                const incomplete=d&&(d.scores||[]).some(v=>v==="");
                return (
                  <button key={s.id} onClick={()=>openYearEdit(y,s.id)}
                    style={{background:d?`${c}1f`:"rgba(255,255,255,.05)",
                      border:d?`1px solid ${c}55`:"1px solid rgba(255,255,255,.1)",
                      borderRadius:8,padding:"6px 2px",cursor:"pointer",textAlign:"center"}}>
                    <div style={{fontSize:10,fontWeight:700,color:d?c:"rgba(255,255,255,.5)"}}>{s.label}</div>
                    {d?(<>
                      <div style={{fontSize:11,fontWeight:800,fontFamily:"monospace",
                        color:sp>=70?"#4ade80":sp>=50?"#fbbf24":"#f87171"}}>{st}<span style={{fontSize:8,opacity:.6}}>/{smx}</span></div>
                      <div style={{fontSize:7.5,opacity:.55,marginTop:1,fontFamily:"monospace",lineHeight:1.3,wordBreak:"break-all"}}>
                        {(d.scores||[]).map((v,i)=>v===""?"—":v).join("・")}
                      </div>
                      {incomplete&&<div style={{fontSize:7,color:"#fbbf24"}}>△未入力あり</div>}
                      {subBlank(y,s.id)>0&&<div style={{fontSize:7,color:"#fbbf24"}}>空白{subBlank(y,s.id)}</div>}
                    </>):<div style={{fontSize:9,opacity:.35,marginTop:1}}>未</div>}
                  </button>
                );
              })}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontSize:10,opacity:.55,flexShrink:0}}>合格最低点</span>
              <input type="number" inputMode="decimal" value={yMin(y)} onChange={e=>updMin(y,e.target.value)}
                placeholder="—" style={{background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.13)",
                  borderRadius:6,padding:"4px 8px",color:"white",fontSize:11,outline:"none",width:70,
                  textAlign:"center",boxSizing:"border-box",colorScheme:"dark",fontFamily:"monospace"}}/>
              {CFG.officialMin[y]!==undefined&&<span style={{fontSize:8.5,opacity:.4}}>※公式</span>}
            </div>
          </div>
        );
      })}

      <div style={{marginTop:8,padding:"11px",borderRadius:10,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)"}}>
        <div style={{fontSize:11,fontWeight:700,marginBottom:6,opacity:.75}}>合格ラインとの比較</div>
        {(()=>{
          const done=YEARS.filter(y=>yHasAny(y)&&!isNaN(parseFloat(yMin(y))));
          if(!done.length) return <div style={{fontSize:11,opacity:.4}}>得点と最低点を入力すると、達成状況が表示されます。</div>;
          const cleared=done.filter(y=>yTotal(y)>=parseFloat(yMin(y))).length;
          return (
            <div>
              <div style={{fontSize:20,fontWeight:900,fontFamily:"monospace",color:cleared>0?"#4ade80":"#f87171"}}>
                {cleared}<span style={{fontSize:12,opacity:.6}}> / {done.length}年で合格ライン突破</span>
              </div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:7}}>
                {done.map(y=>{
                  const ok=yTotal(y)>=parseFloat(yMin(y));
                  const diff=yTotal(y)-parseFloat(yMin(y));
                  return <span key={y} style={{fontSize:9,padding:"3px 6px",borderRadius:5,
                    background:ok?"rgba(34,197,94,.15)":"rgba(239,68,68,.13)",color:ok?"#4ade80":"#fca5a5"}}>
                    {y} {diff>=0?"+":""}{diff}</span>;
                })}
              </div>
            </div>
          );
        })()}
      </div>
      <div style={{fontSize:10,opacity:.35,marginTop:12,lineHeight:1.7}}>※ {CFG.minNote}</div>
    </div>
  );
}

// ── 一覧 ──
const renderSchool=(s,pinned)=>{
  const doneCount=SUBJ.filter(su=>isAvail(s,su.id)&&rec(s.id,su.id)).length;
  const availCount=SUBJ.filter(su=>isAvail(s,su.id)).length;
  if(filterDone==="done"&&doneCount===0) return null;
  if(filterDone==="todo"&&doneCount>0) return null;
  return (
    <div key={s.id} style={{marginBottom:8,padding:"10px 11px",borderRadius:11,
      background:pinned?"rgba(236,72,153,.10)":"rgba(255,255,255,.035)",
      border:pinned?"1.5px solid rgba(244,114,182,.45)":"1px solid rgba(255,255,255,.07)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <div style={{fontSize:13,fontWeight:700,lineHeight:1.3}}>
          {pinned&&<span style={{fontSize:11,color:"#f472b6",marginRight:5}}>★第一志望</span>}
          {s.name}
        </div>
        <span style={{fontSize:10,opacity:.5,flexShrink:0,marginLeft:8}}>{doneCount}/{availCount}</span>
      </div>
      {(()=>{
        const ms=minScores[s.id]||DEFAULT_MIN[s.id]||null;
        const myTot=SUBJ.reduce((a,su)=>{const r=rec(s.id,su.id);return a+(r?recTotal(r):0);},0);
        const allDone=SUBJ.filter(su=>isAvail(s,su.id)).every(su=>rec(s.id,su.id));
        return (
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:7,flexWrap:"wrap"}}>
            <button onClick={()=>setEditMin({schoolId:s.id,schoolName:s.name,
                min:ms&&ms.min!=null?String(ms.min):"", total:ms&&ms.total?String(ms.total):"300"})}
              style={{background:ms&&ms.min!=null?"rgba(251,191,36,.15)":"rgba(255,255,255,.05)",
                border:ms&&ms.min!=null?"1px solid rgba(251,191,36,.35)":"1px dashed rgba(255,255,255,.18)",
                borderRadius:6,padding:"3px 8px",fontSize:9.5,cursor:"pointer",
                color:ms&&ms.min!=null?"#fbbf24":"rgba(255,255,255,.4)"}}>
              {ms&&ms.min!=null?`合格最低点 ${ms.min}/${ms.total||300}${ms.src?" ※公式":""}`:"＋合格最低点"}
            </button>
            {ms&&ms.min!=null&&allDone&&doneCount>0&&(
              <span style={{fontSize:9.5,padding:"3px 7px",borderRadius:5,fontWeight:700,
                background:myTot>=ms.min?"rgba(34,197,94,.18)":"rgba(239,68,68,.15)",
                color:myTot>=ms.min?"#4ade80":"#fca5a5"}}>
                自分 {myTot}点（{myTot>=ms.min?"+":""}{myTot-ms.min}）
              </span>
            )}
            {YEARLY_SCHOOLS[s.id]&&(
              <button onClick={()=>setView(s.id)}
                style={{background:`${YEARLY_SCHOOLS[s.id].color}33`,border:`1px solid ${YEARLY_SCHOOLS[s.id].color}73`,
                  borderRadius:6,padding:"3px 8px",fontSize:9.5,cursor:"pointer",color:YEARLY_SCHOOLS[s.id].color,fontWeight:700}}>
                過去{YEARLY_SCHOOLS[s.id].years}年分を記録 ›
              </button>
            )}
          </div>
        );
      })()}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1.6fr 1fr 1fr",gap:6}}>
        {SUBJ.map(su=>{
          const avail=isAvail(s,su.id);
          const r=rec(s.id,su.id);
          if(!avail){
            return (
              <button key={su.id}
                onClick={()=>{const n={...overrides};n[key(s.id,su.id)]="on";saveOv(n);}}
                style={{background:"rgba(255,255,255,.03)",border:"1px dashed rgba(255,255,255,.13)",
                  borderRadius:8,padding:"7px 2px",cursor:"pointer",textAlign:"center"}}>
                <div style={{fontSize:11,opacity:.35}}>{su.label}</div>
                <div style={{fontSize:9,opacity:.3,marginTop:1}}>掲載なし</div>
              </button>
            );
          }
          const tot=recTotal(r);
          const mx=r?r.max:0;
          const pct=r&&mx?Math.round(tot/mx*100):null;
          return (
            <button key={su.id} onClick={()=>openEdit(s,su.id)}
              style={{background:r?`${su.color}1f`:"rgba(255,255,255,.05)",
                border:r?`1px solid ${su.color}55`:"1px solid rgba(255,255,255,.1)",
                borderRadius:8,padding:"7px 2px",cursor:"pointer",textAlign:"center"}}>
              <div style={{fontSize:11,fontWeight:700,color:r?su.color:"rgba(255,255,255,.5)"}}>{su.label}</div>
              {r
                ? (()=>{
                    const incomplete=r.scores&&r.scores.length>0&&r.scores.some(v=>v==="");
                    return <div style={{fontSize:11,fontWeight:800,fontFamily:"monospace",marginTop:1,
                      color:pct>=70?"#4ade80":pct>=50?"#fbbf24":"#f87171"}}>
                      {pct}%{incomplete&&<span style={{fontSize:8,opacity:.7,fontWeight:400}}>*</span>}
                    </div>;
                  })()
                : <div style={{fontSize:9,opacity:.35,marginTop:1}}>未</div>}
              {su.id==="japanese"&&r&&r.scores&&r.scores.length>0&&(()=>{
                const filled=r.scores.filter(v=>v!=="").length;
                const complete=filled===r.scores.length;
                return (
                  <div style={{marginTop:2}}>
                    <div style={{display:"flex",flexWrap:"wrap",gap:2,justifyContent:"center"}}>
                      {r.scores.map((v,i)=>(
                        <span key={i} style={{fontSize:8,fontFamily:"monospace",padding:"1px 3px",borderRadius:3,
                          background:v===""?"rgba(239,68,68,.16)":"rgba(255,255,255,.10)",
                          color:v===""?"#fca5a5":"rgba(255,255,255,.8)",
                          border:v===""?"1px dashed rgba(248,113,113,.4)":"1px solid transparent"}}>
                          {i+1}:{v===""?"—":v}
                        </span>
                      ))}
                    </div>
                    <div style={{fontSize:7.5,marginTop:2,fontWeight:700,
                      color:complete?"#4ade80":"#fbbf24"}}>
                      {complete?`✓ 全${r.scores.length}問入力済`:`△ ${filled}/${r.scores.length}問のみ`}
                    </div>
                  </div>
                );
              })()}
            </button>
          );
        })}
      </div>
    </div>
  );
};

    {CATS.map(c=>{

      const catDone=list.filter(s=>SUBJ.some(su=>isAvail(s,su.id)&&rec(s.id,su.id))).length;

              borderRadius:10,padding:"11px 13px",cursor:"pointer",color:"white"}}>
            <span style={{fontSize:14,fontWeight:700}}>{c.icon} {c.label}</span>
            <span style={{fontSize:11,opacity:.5}}>{catDone}/{list.length}校　{open?"▲":"▼"}</span>
          </button>
          {open&&<div style={{marginTop:8}}>{list.map(s=>renderSchool(s,s.id===PIN))}</div>}
        </div>
      );
    })}

    <div style={{fontSize:10,opacity:.35,marginTop:14,lineHeight:1.7}}>
      ※「掲載なし」は問題集に収録がない科目です（目次の＊印）。実物と違う場合はタップすると入力できるように切り替わります。<br/>

    </div>
  </div>
);
}

{id:"p-a-c-1-4",subject:"social",field:"土地制度・中世",pts:5,question:"下線部④「この時代の農業や商業にはめざましい発達がみられ」について，室町時代の農業の発達として正しいものをア〜エから選びなさい。（二毛作の広まり，牛馬耕の普及等）",answer:"ウ（西日本から東日本へ広まった二毛作）"},
{id:"p-a-c-1-5",subject:"social",field:"土地制度・一揆",pts:5,question:"下線部⑤「一揆を結んで権力者などに抵抗したりすること」とありますが，1485年に起こった，農民と武士が守護大名を国外に追い出した一揆を何といいますか。漢字で答えなさい。",answer:"山城の国一揆"},
{id:"p-a-c-1-6",subject:"social",field:"土地制度・安土桃山",pts:5,question:"下線部⑥「全国的な土地調査」は，豊臣秀吉によって行われました。この土地調査の名前を漢字で答えなさい。",answer:"太閤検地"},

{id:"p-o-c-1-1",subject:"social",field:"日本地理・大陸",pts:4,question:"文章中の空らん（①）にあてはまる語句をカタカナで答えなさい。（日本はユーラシア大陸の東側に位置する）",answer:"ユーラシア"},
{id:"p-o-c-1-2",subject:"social",field:"日本地理・島",pts:4,question:"下線部②「島」について，次のア〜エの島を西に位置するものから順に並べたとき，3番目になるものを選び，記号で答えなさい。（沖縄・佐渡・対馬・択捉の並び問題）",answer:"ア"},

{id:"p-f-j-1-1",subject:"japanese",field:"漢字の読み書き",pts:5,question:"次の1〜10の──線の漢字はひらがなに，ひらがなは漢字に直しなさい。①春の兆しを感じた。（「兆」をひらがなで）",answer:"きざし"},
{id:"p-f-j-1-2",subject:"japanese",field:"漢字の読み書き",pts:5,question:"②音楽を聞くと心がなごんだ。（「なごんだ」を漢字に）",answer:"和"},
{id:"p-f-j-1-3",subject:"japanese",field:"漢字の読み書き",pts:5,question:"③彼の意見を相続する。（「そうぞく」を漢字に）",answer:"相続"},
{id:"p-f-j-2-1",subject:"japanese",field:"語彙・慣用句",pts:5,question:"次の(1)〜(3)の文のア〜エの中から──線の言葉が正しいものは○，間違っているものは×で答えなさい。(1) 相母が一人，様子で立ち回って，私の世話を焼いてくれた。（ア:かいがいしい ／ イ:あどけない ／ ウ:けむたい ／ エ:いじらしい）",answer:"ア○ イ× ウ× エ×"},

{(()=>{

const yScale=(v)=>PAD.t+(maxH-v)/(maxH-minH)*(H-PAD.t-PAD.b);

allTests.forEach(t=>{
  subjKeys.forEach(k=>{
    const v=parseFloat(t[k+"H"]||t[k+"Hensachi"])||null;
    subjH[k].push(v);
  });
});
const makeLine=(vals,color)=>{
  const pts=vals.map((v,i)=>v!=null?`${xScale(i).toFixed(1)},${yScale(v).toFixed(1)}`:null).filter(Boolean);
  if(pts.length<2) return "";
  return `<polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="1.5" opacity="0.6" stroke-dasharray="4,3"/>`;
};
const mainPts=allTests.map((t,i)=>{const v=parseFloat(t.hensachi);return isNaN(v)?null:`${xScale(i).toFixed(1)},${yScale(v).toFixed(1)}`;}).filter(Boolean);
const mainLine=mainPts.length>=2?`<polyline points="${mainPts.join(" ")}" fill="none" stroke="#a78bfa" stroke-width="2.5"/>`:"";
const ygridLines=[minH,minH+(maxH-minH)/4,minH+(maxH-minH)/2,minH+(maxH-minH)*3/4,maxH].map(v=>
  `<line x1="${PAD.l}" y1="${yScale(v).toFixed(1)}" x2="${W-PAD.r}" y2="${yScale(v).toFixed(1)}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
   <text x="${PAD.l-3}" y="${(yScale(v)+3).toFixed(1)}" fill="rgba(255,255,255,.3)" font-size="8" text-anchor="end">${Math.round(v)}</text>`
).join("");

  ${dots}
  ${xlabels}
</svg>`;

  </div>
</div>
);
})()}

const SM={math:{l:"算数",c:"#3b82f6",i:"∑"},japanese:{l:"国語",c:"#ef4444",i:"文"},science:{l:"理科",c:"#22c55e",i:"⚗"},social:{l:"社会",c:"#f59e0b",i:"🌏"}};
// 難易度ベースの評価関数: myRate(自分の正答率) と avgRate(受験者平均=問題難易度) を使う
const getDiffLabel=(f)=>{
  const my=f.myRate!=null?f.myRate:(f.rate!=null?f.rate:null);
  const av=f.avgRate!=null?f.avgRate:null;
  if(my==null) return {label:"",color:"#6b7280",bg:"rgba(107,114,128,.1)",border:"rgba(107,114,128,.2)"};
  if(av==null){
    // avgRateがない古いデータはpriorityで判定
    if(f.priority==="high") return {label:"🔴 要克服",color:"#ef4444",bg:"rgba(239,68,68,.08)",border:"rgba(239,68,68,.25)"};
    if(f.priority==="mid")  return {label:"🟡 要注意",color:"#f59e0b",bg:"rgba(245,158,11,.08)",border:"rgba(245,158,11,.25)"};
    return {label:"✅ 平均以上",color:"#4ade80",bg:"rgba(74,222,128,.06)",border:"rgba(74,222,128,.2)"};
  }
  if(av>=60&&my<av)    return {label:"🔴 要克服",sub:"簡単な問題で失点",color:"#ef4444",bg:"rgba(239,68,68,.08)",border:"rgba(239,68,68,.25)"};
  if(av>=40&&my<av-10) return {label:"🟡 要注意",sub:"平均を大幅に下回る",color:"#f59e0b",bg:"rgba(245,158,11,.08)",border:"rgba(245,158,11,.25)"};
  if(av<40&&my<av)     return {label:"⚪ 難問",sub:"難問だが平均を下回る",color:"#94a3b8",bg:"rgba(148,163,184,.06)",border:"rgba(148,163,184,.2)"};
  return {label:"✅ 平均以上",color:"#4ade80",bg:"rgba(74,222,128,.06)",border:"rgba(74,222,128,.2)"};
};
const makeSuggestions=()=>{
  if(!t.weakFields) return [];
  return ["math","japanese","science","social"].map(s=>{
    const allFields=(t.weakFields[s]||[]);
    const fields=allFields.filter(f=>{
      const dl=getDiffLabel(f);
      return dl.label!=="✅ 平均以上";
    });
    if(!fields.length) return null;
    const relatedUnits=[];
    const unitList=UNITS[s]||[];
    fields.forEach(f=>{
      const matched=unitList.filter(u=>u.title.includes(f.field.split("（")[0])||f.field.includes(u.title)).slice(0,2);
      relatedUnits.push(...matched);
    });
    return{sid:s,subj:SM[s],fields,relatedUnits:[...new Set(relatedUnits)]};
  }).filter(Boolean);
};
const suggs=makeSuggestions();
const h=parseFloat(t.hensachi)||null;
const gap=h?Math.round((targetHensachi-h)*10)/10:null;
return(
<div>
  <button onClick={()=>setSelectedTest(null)} style={{background:"rgba(255,255,255,.07)",border:"1px solid rgba(255,255,255,.12)",color:"rgba(255,255,255,.65)",padding:"5px 14px",borderRadius:20,fontSize:12,cursor:"pointer",fontFamily:noto,marginBottom:14}}>‹ 一覧に戻る</button>
  {/* ヘッダー */}
  <div style={{borderRadius:16,background:"linear-gradient(135deg,#0f1e3a,#162d4f)",border:"1px solid rgba(59,130,246,.3)",padding:"16px",marginBottom:14}}>
    <div style={{fontSize:10,color:"#60a5fa",fontWeight:700,letterSpacing:1,marginBottom:4}}>{t.date}</div>
    <div style={{fontSize:17,fontWeight:700,fontFamily:serif,marginBottom:10}}>{t.name}</div>
    <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:10}}>
      <div style={{fontSize:40,fontWeight:900,fontFamily:"monospace",color:h>=targetHensachi?"#4ade80":h>=targetHensachi-5?"#f59e0b":"#f87171"}}>{t.total}</div>
      <div style={{fontSize:13,opacity:.5}}>/ {t.maxTotal||500}点</div>
      <div style={{marginLeft:"auto",textAlign:"right"}}>
        {h!=null&&<><div style={{fontSize:28,fontWeight:900,fontFamily:"monospace",color:h>=targetHensachi?"#4ade80":h>=targetHensachi-5?"#f59e0b":"#f87171"}}>{h}</div><div style={{fontSize:9,opacity:.45}}>4科偏差値</div></>}
        {gap!=null&&<div style={{fontSize:10,color:gap<=0?"#4ade80":"#f87171",marginTop:2}}>{gap<=0?`目標達成✅`:`目標まで+${gap}`}</div>}
      </div>
    </div>
    {/* 目標偏差値ゲージ */}
    {h!=null&&(
      <div style={{marginBottom:10}}>

        <div style={{height:6,borderRadius:3,background:"rgba(255,255,255,.1)",position:"relative",overflow:"visible"}}>
          <div style={{height:"100%",borderRadius:3,background:"linear-gradient(90deg,#ef4444,#f59e0b,#4ade80)",width:`${Math.min(100,Math.max(0,(h-40)/(80-40)*100))}%`}}/>
          <div style={{position:"absolute",top:-2,left:`${Math.min(100,Math.max(0,(targetHensachi-40)/(80-40)*100))}%`,transform:"translateX(-50%)",width:2,height:10,background:"#a78bfa",borderRadius:1}}/>
        </div>
      </div>
    )}
    {/* 科目別 */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>
      {["math","japanese","science","social"].map(k=>{

            <div style={{fontSize:16,fontWeight:900,fontFamily:"monospace"}}>{sc!=null?sc:"—"}</div>
            <div style={{fontSize:8,opacity:.45}}>/{mx}</div>
            {sh!=null&&<div style={{fontSize:10,color:"#a78bfa",fontWeight:700}}>{sh}</div>}
            {pct!=null&&<div style={{marginTop:4,height:3,borderRadius:2,background:"rgba(255,255,255,.1)",overflow:"hidden"}}><div style={{height:"100%",background:sm.c,width:`${pct}%`}}/></div>}
          </div>
        );
      })}
    </div>
  </div>

  {/* 弱点分野＋得意分野（切り替えボタン付き） */}
  {(()=>{
    // 得意分野（平均以上）
    const makeStrengths=()=>{
      if(!t.weakFields) return [];
      return ["math","japanese","science","social"].map(s=>{
        const fields=(t.weakFields[s]||[]).filter(f=>{
          const dl=getDiffLabel(f);
          return dl.label==="✅ 平均以上";
        });
        if(!fields.length) return null;
        return{sid:s,subj:SM[s],fields};
      }).filter(Boolean);
    };
    const strengths=makeStrengths();
    const hasWeak=suggs.length>0;
    const hasStrong=strengths.length>0;
    if(!hasWeak&&!hasStrong) return null;

    // 共通カードUI
    const FieldCard=({f,subj})=>{
      const dl=getDiffLabel(f);
      const my=f.myRate!=null?f.myRate:(f.rate!=null?Math.round(f.rate):null);
      const av=f.avgRate!=null?Math.round(f.avgRate):null;
      return(
        <div style={{fontSize:12,background:dl.bg,border:`1px solid ${dl.border}`,borderRadius:10,padding:"9px 11px",marginBottom:7,lineHeight:1.6}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
            <span style={{fontWeight:700,color:"white",fontSize:13}}>{f.field}</span>
            <span style={{fontSize:10,fontWeight:700,color:dl.color,background:`${dl.color}22`,padding:"2px 7px",borderRadius:10,flexShrink:0,marginLeft:6}}>
              {dl.label}{dl.sub?` — ${dl.sub}`:""}
            </span>
          </div>
          {(my!=null||av!=null)&&(
            <div style={{marginBottom:5}}>
              {my!=null&&(
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                  <span style={{fontSize:9,color:"rgba(255,255,255,.4)",width:60,flexShrink:0}}>自分</span>
                  <div style={{flex:1,height:5,borderRadius:3,background:"rgba(255,255,255,.08)",overflow:"hidden"}}>
                    <div style={{height:"100%",borderRadius:3,background:my<40?"#ef4444":my<60?"#f59e0b":"#4ade80",width:`${my}%`,transition:"width .4s"}}/>
                  </div>
                  <span style={{fontSize:10,fontWeight:700,color:my<40?"#f87171":my<60?"#fcd34d":"#4ade80",width:34,textAlign:"right",flexShrink:0}}>{my}%</span>
                </div>
              )}
              {av!=null&&(
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:9,color:"rgba(255,255,255,.4)",width:60,flexShrink:0}}>受験者平均</span>

                </div>
              )}
            </div>

          <div style={{display:"flex",alignItems:"baseline",gap:8,flexWrap:"wrap"}}>

            {av!=null&&<span style={{fontSize:9,color:"rgba(255,255,255,.3)"}}>（問題難易度: {av>=70?"易":av>=50?"標準":av>=35?"やや難":"難問"}）</span>}

            <div style={{fontSize:10,color:"rgba(255,255,255,.45)",marginTop:4,paddingTop:4,borderTop:"1px solid rgba(255,255,255,.05)"}}>

                ?(av>=60&&my<av?"受験者の多くが取れる問題です。基礎を固め直しましょう。":av>=40&&my<av-10?"平均を大幅に下回っています。この分野を重点的に復習してください。":"難問ですが、差をつけられないよう対策しておきましょう。")
                :"平均を上回っています。このレベルを本番でも安定して取れるようにしましょう。"
              )}
            </div>
          )}
        </div>
      );
    };

    const currentList=weakViewMode==="weak"?suggs:strengths;
    return(
      <div>
        {/* 切り替えボタン */}
        <div style={{display:"flex",gap:6,marginBottom:12}}>
          <button onClick={()=>setWeakViewMode("weak")} style={{flex:1,padding:"9px 0",borderRadius:10,border:`1.5px solid ${weakViewMode==="weak"?"#ef444488":"rgba(255,255,255,.1)"}`,background:weakViewMode==="weak"?"rgba(239,68,68,.15)":"transparent",color:weakViewMode==="weak"?"#f87171":"rgba(255,255,255,.35)",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:noto}}>
            🔴 苦手分野 {hasWeak?`(${suggs.reduce((a,s)=>a+s.fields.length,0)})` :""}
          </button>
          <button onClick={()=>setWeakViewMode("strong")} style={{flex:1,padding:"9px 0",borderRadius:10,border:`1.5px solid ${weakViewMode==="strong"?"#4ade8088":"rgba(255,255,255,.1)"}`,background:weakViewMode==="strong"?"rgba(74,222,128,.12)":"transparent",color:weakViewMode==="strong"?"#4ade80":"rgba(255,255,255,.35)",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:noto}}>
            ✅ 得意分野 {hasStrong?`(${strengths.reduce((a,s)=>a+s.fields.length,0)})` :""}
          </button>
        </div>

        {/* コンテンツ */}
        {currentList.length===0?(
          <div style={{textAlign:"center",fontSize:12,opacity:.28,padding:"18px 0"}}>
            {weakViewMode==="weak"?"苦手分野なし — 全分野平均以上です！":"得意分野のデータがありません"}
          </div>
        ):(
          currentList.map((sg,i)=>(
            <div key={i} style={{marginBottom:12,borderRadius:12,border:`1px solid ${sg.subj.c}33`,overflow:"hidden"}}>
              <div style={{padding:"9px 13px",background:`${sg.subj.c}18`,borderBottom:`1px solid ${sg.subj.c}22`,display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:15}}>{sg.subj.i}</span>
                <span style={{fontSize:13,fontWeight:700,color:sg.subj.c}}>{sg.subj.l}</span>
              </div>
              <div style={{padding:"10px 13px"}}>
                {sg.fields.map((f,j)=><FieldCard key={j} f={f} subj={sg.subj}/>)}
                {weakViewMode==="weak"&&sg.relatedUnits&&sg.relatedUnits.length>0&&(
                  <div style={{borderTop:"1px solid rgba(255,255,255,.06)",paddingTop:8}}>
                    <div style={{fontSize:10,opacity:.38,marginBottom:6}}>📋 デイリーサポートで確認すべき単元</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                      {sg.relatedUnits.slice(0,4).map((u,j)=>(
                        <span key={j} onClick={onOpenDaily} style={{fontSize:10,fontWeight:700,padding:"4px 10px",borderRadius:20,background:`${sg.subj.c}22`,color:sg.subj.c,border:`1px solid ${sg.subj.c}44`,cursor:"pointer"}}>{u.code}「{u.title}」</span>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          ))
        )}
      </div>
    );
  })()}

  {/* ── 青学換算 ── */}
  {t.qData&&(()=>{
    const c=convertToAoyama(t); if(!c) return null;
    const C=AOYAMA_CONV;
    return (
      <div style={{marginBottom:14,borderRadius:12,overflow:"hidden",
        background:"linear-gradient(160deg,rgba(236,72,153,.13),rgba(59,130,246,.08))",
        border:"1px solid rgba(244,114,182,.32)"}}>
        <div style={{padding:"10px 12px",borderBottom:"1px solid rgba(244,114,182,.18)"}}>
          <div style={{fontSize:12.5,fontWeight:800,color:"#f9a8d4"}}>★ 青学換算スコア</div>
          <div style={{fontSize:9.5,opacity:.5,marginTop:2}}>青学の実問題4年分の難易度構成にもとづく換算</div>
        </div>
        <div style={{padding:"11px 12px"}}>
          <div style={{textAlign:"center",marginBottom:9}}>
            <div style={{fontSize:30,fontWeight:900,fontFamily:"monospace",lineHeight:1.05,
              color:c.gap>=0?"#4ade80":"#f87171"}}>{c.total}<span style={{fontSize:13,opacity:.55}}>/{C.total}</span></div>
            <div style={{fontSize:12,fontWeight:700,color:c.gap>=0?"#4ade80":"#f87171"}}>
              合格ライン{C.line}点まで {c.gap>=0?`+${c.gap}`:c.gap}点
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5,marginBottom:10}}>

              const v=c.subjects[s]; if(!v||v.conv==null) return <div key={s}/>;

              return (
                <div key={s} style={{padding:"7px 3px",borderRadius:9,textAlign:"center",
                  background:`${C.color[s]}16`,border:`1px solid ${C.color[s]}3d`}}>
                  <div style={{fontSize:9.5,fontWeight:700,color:C.color[s]}}>{C.label[s]}</div>
                  <div style={{fontSize:15,fontWeight:900,fontFamily:"monospace",color:ok?"#4ade80":"#fbbf24"}}>
                    {v.conv}<span style={{fontSize:8,opacity:.5}}>/{C.max[s]}</span></div>
                  <div style={{fontSize:8,opacity:.45}}>目標{C.goal[s]}</div>
                </div>
              );
            })}
          </div>
          {/* 難易度帯ごとの内訳 */}
          <div style={{padding:"9px 10px",borderRadius:9,background:"rgba(6,12,24,.4)"}}>

              <div/>
              {["A","B","C","D"].map(lv=>(
                <div key={lv} style={{opacity:.55,fontWeight:700}}>{C.levelName[lv]}</div>

              {["math","japanese","science","social"].map(s=>{
                const v=c.subjects[s]; if(!v||!v.bands) return null;

                  </React.Fragment>

              })}
            </div>

              青学の配点比率：算数は基礎13%・標準20%・応用40%・難問27%。<b>算数は応用問題を取らないと合格点に届きません。</b>
            </div>
          </div>
        </div>
      </div>
    );
  })()}

  {/* ── 易問分析（設問レベル） ── */}
  {t.qData&&(()=>{
    const SUBJS=[["math","算数","#3b82f6"],["japanese","国語","#ef4444"],["science","理科","#22c55e"],["social","社会","#f59e0b"]];
    const rows=SUBJS.map(([sid,label,color])=>{
      const qs=t.qData[sid]||[];
      const lostHigh=qs.filter(q=>q[2]==="×"&&q[3]>=60).sort((a,b)=>b[3]-a[3]);
      const lostPts=lostHigh.reduce((a,q)=>a+q[1],0);
      const easyAll=qs.filter(q=>q[3]>=60);
      const easyGot=easyAll.filter(q=>q[2]==="○").reduce((a,q)=>a+q[1],0);
      const easyTotal=easyAll.reduce((a,q)=>a+q[1],0);
      const easyPct=easyTotal?Math.round(easyGot/easyTotal*100):null;
      return {sid,label,color,lostPts,lostHigh,easyPct};
    });
    const totalLost=rows.reduce((a,r)=>a+r.lostPts,0);
    const total=parseInt(t.total)||0;
    if(totalLost===0&&rows.every(r=>r.easyPct===null)) return null;

      <div style={{marginBottom:14,borderRadius:12,border:"1px solid rgba(96,165,250,.3)",overflow:"hidden"}}>

          {rows.map((r,i)=>(
            <div key={i} style={{marginBottom:8,padding:"8px 10px",borderRadius:9,background:`${r.color}10`,border:`1px solid ${r.color}28`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:r.lostHigh.length?6:0}}>
                <span style={{fontSize:12,fontWeight:700,color:r.color}}>{r.label}</span>
                <span style={{fontSize:11}}>
                  <span style={{color:"#f87171",fontWeight:700}}>−{r.lostPts}点</span>
                  {r.easyPct!=null&&<span style={{opacity:.45,marginLeft:8}}>易問正答率 {r.easyPct}%</span>}

              </div>
              {r.lostHigh.length>0&&(
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                  {r.lostHigh.map((q,j)=>(
                    <span key={j} style={{fontSize:9,padding:"2px 6px",borderRadius:5,background:"rgba(239,68,68,.13)",color:"#fca5a5"}}>
                      {q[0]} {q[1]}点<span style={{opacity:.6}}>（{Math.round(q[3])}%が正解）</span>
                    </span>
                  ))}
                </div>
              )}
            </div>
          ))}
          <div style={{fontSize:10,opacity:.4,marginTop:6,lineHeight:1.6}}>
            💡 難問対策よりも、ここに並んだ問題（＝解けたはずの基本問題）をなくすことが平均点への最短ルートです。
          </div>
        </div>
      </div>
    );
  })()}
  {t.memo&&<div style={{fontSize:11,opacity:.4,padding:"8px 12px",borderRadius:8,background:"rgba(255,255,255,.03)",marginBottom:12}}>{t.memo}</div>}
</div>
);
})()}

// メインアプリ（ホーム＋デイリーサポート統合）
// ============================================================
function App() {
const [screen, setScreen] = useState("home");   // "home" | "daily" | "ws"
const [page, setPage] = useState("dashboard");
const [selectedSubject, setSelectedSubject] = useState(null);
const [selectedUnit, setSelectedUnit] = useState(null);
const [allAnswers, setAllAnswers] = useState({});
// 土曜特訓（WeeklySapiX）の状態
const [wsScreen, setWsScreen] = useState("dashboard"); // "dashboard" | "detail"
const [wsSelectedSubject, setWsSelectedSubject] = useState(null);
const [wsSelectedUnit, setWsSelectedUnit] = useState(null);
const [wsAllAnswers, setWsAllAnswers] = useState({});
const wsAllAnswersRef = React.useRef({});
const [downloading, setDownloading] = useState(false);
const [dlDone, setDlDone] = useState(false);
const [saveStatus, setSaveStatus] = useState("idle"); // "idle"|"saving"|"saved"|"error"
const saveTimerRef = React.useRef(null);
// 最新のallAnswersをRefで追跡（非同期保存で最新値を確実に使うため）
const allAnswersRef = React.useRef({});

// ── 回答の読み込み（全バックエンドから読み込みマージ・データ消失防止）──
useEffect(() => {
(async () => {
try {
  setSaveStatus("saving");
  // 1. Supabaseから読み込み（設定済みの場合）
  if (supabase) {
    const cloudData = await supabase.loadAnswers();
    if (cloudData) {
      const count = Object.values(cloudData).reduce((a,u)=>a+Object.keys(u||{}).length,0);
      // ローカルにも同じデータがあれば merge（ローカルの方が新しい問題IDを持っている可能性）
      let merged = {...cloudData};
      try {
        const localRaw = await Storage.get("sapix_all_answers");
        if (localRaw) {
          const localData = JSON.parse(localRaw.value);
          // 両方を merge: 各unitId・problemId について
          // どちらかに値があれば保持（cloudDataを優先）
          for (const [uid, probs] of Object.entries(localData)) {
            if (!merged[uid]) merged[uid] = {};
            for (const [pid, val] of Object.entries(probs)) {
              // cloudDataにない問題IDはローカルから補完
              if (merged[uid][pid] === undefined) {
                merged[uid][pid] = val;
              }
            }
          }
        }
      } catch {}
      allAnswersRef.current = merged;
      setAllAnswers(merged);
      try { await Storage.set("sapix_all_answers", JSON.stringify(merged)); } catch {}
      setSaveStatus("idle");
      const cu = await supabase.loadCustomUnits();
      if (cu && Object.keys(cu).length > 0) {
        const sanitized = {};
        for (const [k, v] of Object.entries(cu)) sanitized[k] = sanitizeUnit({...v}) || v;
        setCustomUnits(sanitized);
      }
      return;
    }
  }
  // 2. ローカルから読み込み（フォールバック）
  let bestData = null;
  let bestCount = -1;
  const loaders = [
    async () => { try { const r = await Storage.get("sapix_all_answers"); return r ? JSON.parse(r.value) : null; } catch { return null; } },
    async () => { try { const v = localStorage.getItem("sapix_all_answers"); return v ? JSON.parse(v) : null; } catch { return null; } },
    async () => { try { if (window.storage) { const r = await window.storage.get("sapix_all_answers", true); return r ? JSON.parse(r.value) : null; } } catch {} return null; },
  ];
  // 全ストレージから取得してmerge（最も多いデータを基準に全てを合成）
  const allLocalData = [];
  for (const load of loaders) {
    const data = await load();
    if (data && typeof data === 'object') {
      const count = Object.values(data).reduce((a,u)=>a+Object.keys(u||{}).length,0);
      if (count > 0) allLocalData.push(data);
      if (count > bestCount) { bestCount = count; bestData = data; }
    }
  }
  // 複数ストレージをmerge（どれか一つにあれば保持）
  if (allLocalData.length > 1) {
    const merged = {...bestData};
    for (const d of allLocalData) {
      for (const [uid, probs] of Object.entries(d)) {
        if (!merged[uid]) merged[uid] = {};
        for (const [pid, val] of Object.entries(probs)) {
          if (merged[uid][pid] === undefined) merged[uid][pid] = val;
        }
      }
    }
    bestData = merged;
    bestCount = Object.values(merged).reduce((a,u)=>a+Object.keys(u||{}).length,0);
  }
  if (bestData && bestCount > 0) {
    allAnswersRef.current = bestData;
    setAllAnswers(bestData);
    // 全ストレージに同期（データ保全）
    try { await Storage.set("sapix_all_answers", JSON.stringify(bestData)); } catch {}
    try { localStorage.setItem("sapix_all_answers", JSON.stringify(bestData)); } catch {}
  }
} catch(e) {
}
setSaveStatus("idle");
if (!allAnswersRef.current) { allAnswersRef.current = {}; }
})();
}, []);

// ページを離れる前にも確実に保存
useEffect(() => {
const save = () => {
const data = allAnswersRef.current;
if (Object.keys(data).length > 0) {
// beacon API で同期的に保存を試みる（非同期不可の場合）
try {
Storage.set("sapix_all_answers", JSON.stringify(data)).catch(()=>{});
} catch {}
}
};
window.addEventListener("beforeunload", save);
window.addEventListener("pagehide", save);
return () => {
window.removeEventListener("beforeunload", save);
window.removeEventListener("pagehide", save);
};
}, []);

// ── 回答の保存（全バックエンドへの冗長書き込み・データ消失防止）──
const saveAllAnswers = async (data) => {
setSaveStatus("saving");
const json = JSON.stringify(data);
let anySuccess = false;
const writes = [
  // 1. Supabase（クラウド・最優先）
  (async () => {
    if (!supabase) return false;
    try { return await supabase.saveAllAnswers(data); } catch { return false; }
  })(),
  // 2. IndexedDB / Storage
  (async () => {
    for (let i = 0; i < 3; i++) {
      try { const r = await Storage.set("sapix_all_answers", json); if (r != null) return true; } catch {}
      await new Promise(r => setTimeout(r, 100));
    }
    return false;
  })(),
  // 3. localStorage
  (async () => { try { localStorage.setItem("sapix_all_answers", json); return true; } catch { return false; } })(),
  // 4. window.storage shared
  (async () => { try { if (window.storage) { const r = await window.storage.set("sapix_all_answers", json, true); return r != null; } } catch {} return false; })(),
];
const results = await Promise.allSettled(writes);
anySuccess = results.some(r => r.status === 'fulfilled' && r.value === true);
if (anySuccess) {
  setSaveStatus("saved");
  if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
  saveTimerRef.current = setTimeout(() => setSaveStatus("idle"), 3000);
} else {
  setSaveStatus("error");
}
return anySuccess;
};
// ── 単元選択ハンドラ ──
const handleSelectUnit = (subj, unit) => {
setSelectedSubject(subj);
setSelectedUnit(unit);
setPage("detail");
};

// 土曜特訓の単元選択ハンドラ
const handleWsSelectUnit = (subj, unit) => {
setWsSelectedSubject(subj);
setWsSelectedUnit(unit);
setWsScreen("detail");
};

// 土曜特訓の正誤変更ハンドラ
const handleWsAnswerChange = (pid, value) => {
const unitId = wsSelectedUnit?.id;
if (!unitId) return;
const prev = wsAllAnswersRef.current;
const next = {
  ...prev,
  [unitId]: { ...(prev[unitId] || {}), [pid]: value },
};
if (value === null) {
  next[unitId] = { ...(prev[unitId] || {}) };
  delete next[unitId][pid];
}
wsAllAnswersRef.current = next;
setWsAllAnswers(next);
// ローカルストレージに保存（Supabaseにも保存する場合は拡張）
try { localStorage.setItem("sapix_ws_answers", JSON.stringify(next)); } catch {}
try { Storage.set("sapix_ws_answers", JSON.stringify(next)).catch(()=>{}); } catch {}
};


// ── 正誤変更ハンドラ（Supabase + ローカル保存）──
const handleAnswerChange = (pid, value) => {
const unitId = selectedUnit?.id;
if (!unitId) return;
// prev を完全に保持（旧IDのデータも含む）してから新しい値を上書き
const prev = allAnswersRef.current;
const next = {
  ...prev,  // 全単元・全問題の旧データを保持
  [unitId]: { ...(prev[unitId] || {}), [pid]: value },
};
// nullの場合はキーを削除（未回答に戻す）
if (value === null) {
  next[unitId] = { ...(prev[unitId] || {}) };
  delete next[unitId][pid];
}
allAnswersRef.current = next;
setAllAnswers(next);
// Supabaseに個別保存（最速・PATCH方式）
if (supabase && value !== null) {
  supabase.saveAnswer(unitId, pid, value).catch(() => {});
}
// 全バックエンドに保存（IndexedDB + localStorage）
saveAllAnswers(next);
};




// ── 土曜特訓データの読み込み ──
useEffect(() => {
(async () => {
try {
  let wsData = null;
  try { const r = await Storage.get("sapix_ws_answers"); if(r) wsData = JSON.parse(r.value); } catch {}
  if (!wsData) { try { const v = localStorage.getItem("sapix_ws_answers"); if(v) wsData = JSON.parse(v); } catch {} }
  if (wsData && typeof wsData === 'object') {
    wsAllAnswersRef.current = wsData;
    setWsAllAnswers(wsData);
  }
} catch(e) {}
})();
}, []);
