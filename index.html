<script>window.storage=(()=>{const DB='sapix_v2',ST='kv';let db=null;
const open=()=>new Promise((r,e)=>{if(db){r(db);return;}const q=indexedDB.open(DB,1);
q.onupgradeneeded=v=>v.target.result.createObjectStore(ST);
q.onsuccess=v=>{db=v.target.result;r(db);};q.onerror=()=>e(q.error);});
const run=async(m,f)=>{const d=await open();return new Promise((r,e)=>{
const t=d.transaction(ST,m),s=t.objectStore(ST),q=f(s);
if(q){q.onsuccess=()=>r(q.result);q.onerror=()=>e(q.error);}
else{t.oncomplete=()=>r();t.onerror=()=>e(t.error);}});};
return{
get:async k=>{try{const v=await run('readonly',s=>s.get(k));return v!==undefined?{key:k,value:v}:null;}catch{return null;}},
set:async(k,v)=>{try{await run('readwrite',s=>s.put(v,k));return{key:k,value:v};}catch{return null;}},
delete:async k=>{try{await run('readwrite',s=>s.delete(k));return{key:k,deleted:true};}catch{return null;}},
list:async(p='')=>{try{const ks=await run('readonly',s=>s.getAllKeys());return{keys:(ks||[]).filter(k=>String(k).startsWith(p))};}catch{return{keys:[]};}}
};})();</script>

    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'activated') {
          // 新版が適用されたらページをリロード
          window.location.reload();

    });

// Reactはグローバル変数として利用
const { useState, useEffect, useCallback } = React;

// ============================================================
// データ定義：科目・回・問題
// ============================================================
// ============================================================
// ストレージ抽象化レイヤー（永続化保証版）
// 優先順位: window.storage → localStorage → IndexedDB
// ユーザーデータを絶対にリセットしない
// ============================================================
const Storage = (() => {
  // ── 1. window.storage（Claude artifact API）──
  const ws = {
    available: () => {
      try {
        return typeof window !== 'undefined' &&
          window.storage != null &&
          typeof window.storage.get === 'function' &&
          typeof window.storage.set === 'function';
      } catch { return false; }
    },
    get: async (key) => { try { return await window.storage.get(key, true); } catch { return null; } },
    set: async (key, value) => { try { return await window.storage.set(key, value, true); } catch { return null; } },
    delete: async (key) => { try { return await window.storage.delete(key, true); } catch { return null; } },
    list: async (prefix) => { try { return await window.storage.list(prefix, true); } catch { return { keys: [] }; } },
  };

  // ── 2. localStorage ──
  const ls = {
    available: () => { try { localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return true; } catch { return false; } },
    get: async (key) => { try { const v = localStorage.getItem(key); return v != null ? { key, value: v } : null; } catch { return null; } },
    set: async (key, value) => { try { localStorage.setItem(key, value); return { key, value }; } catch { return null; } },
    delete: async (key) => { try { localStorage.removeItem(key); return { key, deleted: true }; } catch { return null; } },
    list: async (prefix = '') => {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(prefix)) keys.push(k);
        }
        return { keys };
      } catch { return { keys: [] }; }
    },
  };

  // ── 3. IndexedDB（最終フォールバック）──
  const idb = (() => {
    const DB = 'sapix_db', STORE = 'kv';
    let _db = null;
    const open = () => new Promise((res, rej) => {
      if (_db) { res(_db); return; }
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = e => e.target.result.createObjectStore(STORE);
      r.onsuccess = e => { _db = e.target.result; res(_db); };
      r.onerror = () => rej(r.error);
    });
    const tx = async (mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction(STORE, mode);
        const s = t.objectStore(STORE);
        const r = fn(s);
        if (r) { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
        else { t.oncomplete = () => res(); t.onerror = () => rej(t.error); }
      });
    };
    return {
      available: () => typeof indexedDB !== 'undefined',
      get: async (key) => { try { const v = await tx('readonly', s => s.get(key)); return v != null ? { key, value: v } : null; } catch { return null; } },
      set: async (key, value) => { try { await tx('readwrite', s => s.put(value, key)); return { key, value }; } catch { return null; } },
      delete: async (key) => { try { await tx('readwrite', s => s.delete(key)); return { key, deleted: true }; } catch { return null; } },
      list: async (prefix = '') => {
        try {
          const keys = await tx('readonly', s => s.getAllKeys());
          return { keys: (keys || []).filter(k => typeof k === 'string' && k.startsWith(prefix)) };
        } catch { return { keys: [] }; }
      },
    };
  })();

  // 利用可能なストレージを選択（複数に同時書き込みして確実に保存）
  const getBackends = () => {
    const backends = [];
    if (ws.available()) backends.push(ws);
    if (ls.available()) backends.push(ls);
    if (idb.available()) backends.push(idb);
    return backends.length > 0 ? backends : [idb]; // 最低限idb
  };

  return {
    get: async (key) => {
      // 全バックエンドから順に試して最初に見つかった値を返す
      for (const b of getBackends()) {
        const r = await b.get(key);
        if (r != null) return r;
      }
      return null;
    },
    set: async (key, value) => {
      // 全バックエンドに並行書き込み（冗長保存）
      const backends = getBackends();
      const results = await Promise.allSettled(backends.map(b => b.set(key, value)));
      const success = results.find(r => r.status === 'fulfilled' && r.value != null);
      return success ? success.value : null;
    },
    delete: async (key) => {
      const backends = getBackends();
      await Promise.allSettled(backends.map(b => b.delete(key)));
      return { key, deleted: true };
    },
    list: async (prefix = '') => {
      for (const b of getBackends()) {
        const r = await b.list(prefix);
        if (r && r.keys && r.keys.length > 0) return r;
      }
      // 全バックエンドを集約
      const allKeys = new Set();
      for (const b of getBackends()) {
        const r = await b.list(prefix);
        if (r && r.keys) r.keys.forEach(k => allKeys.add(k));
      }
      return { keys: [...allKeys] };
    },
  };
})();

// ============================================================
// 単元データ整合性チェック＆自動修復
// 起動時・UNITS変更時に実行して常に安全な状態を保つ
// ============================================================
function sanitizeUnit(unit) {
  if (!unit || typeof unit !== 'object') return null;
  // sections が配列でない場合は空配列に
  if (!Array.isArray(unit.sections)) unit.sections = [];
  // 各sectionのproblemsが配列でない場合は空配列に
  unit.sections = unit.sections.map(sec => {
    if (!sec || typeof sec !== 'object') return null;
    if (!Array.isArray(sec.problems)) sec.problems = [];
    // 必須フィールドの保証
    return {
      id: sec.id || `sec-${Math.random().toString(36).slice(2,7)}`,
      label: sec.label || '問題',
      diff: sec.diff || 2,
      cat: sec.cat || '問題',
      problems: sec.problems.filter(p => p && p.id).map(p => ({
        id: p.id,
        text: p.text || '',
        pts: typeof p.pts === 'number' ? p.pts : 5,
      })),
    };
  }).filter(Boolean);
  return unit;
}

function sanitizeAllUnits(units) {
  const result = {};
  for (const [subjId, arr] of Object.entries(units)) {
    if (!Array.isArray(arr)) { result[subjId] = []; continue; }
    result[subjId] = arr.map(sanitizeUnit).filter(Boolean);
  }
  return result;
}

const supabase = (() => {

  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json",
    "Prefer": "return=minimal",

  return {
    // 正誤データを全件読み込み
    loadAnswers: async () => {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/sapix_answers?user_id=eq.${USER_ID}&select=unit_id,problem_id,is_correct`,
          { headers }
        );
        if (!res.ok) return null;
        const rows = await res.json();
        // {unitId: {problemId: true/false}} 形式に変換
        const result = {};
        for (const row of rows) {
          if (!result[row.unit_id]) result[row.unit_id] = {};
          result[row.unit_id][row.problem_id] = row.is_correct;
        }
        return result;
      } catch { return null; }
    },

    // 1問の正誤を保存（upsert）
    saveAnswer: async (unitId, problemId, isCorrect) => {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/sapix_answers`,
          {
            method: "POST",
            headers: { ...headers, "Prefer": "resolution=merge-duplicates,return=minimal" },
            body: JSON.stringify({
              user_id: USER_ID,
              unit_id: unitId,
              problem_id: problemId,
              is_correct: isCorrect,
              updated_at: new Date().toISOString(),
            }),
          }
        );
        return res.ok;
      } catch { return false; }
    },

    // 全正誤データを一括保存（初回移行用）
    saveAllAnswers: async (allAnswers) => {
      try {
        const rows = [];
        for (const [unitId, probs] of Object.entries(allAnswers)) {
          for (const [problemId, isCorrect] of Object.entries(probs)) {
            rows.push({
              user_id: USER_ID,
              unit_id: unitId,
              problem_id: problemId,
              is_correct: isCorrect,
              updated_at: new Date().toISOString(),
            });
          }
        }
        if (rows.length === 0) return true;
        // 50件ずつ分割してupsert
        for (let i = 0; i < rows.length; i += 50) {
          const chunk = rows.slice(i, i + 50);
          const res = await fetch(
            `${SUPABASE_URL}/rest/v1/sapix_answers`,
            {
              method: "POST",
              headers: { ...headers, "Prefer": "resolution=merge-duplicates,return=minimal" },
              body: JSON.stringify(chunk),
            }
          );
          if (!res.ok) return false;
        }
        return true;
      } catch { return false; }
    },

    // カスタム単元を保存
    saveCustomUnit: async (unitId, unitData) => {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/sapix_custom_units`,
          {
            method: "POST",
            headers: { ...headers, "Prefer": "resolution=merge-duplicates,return=minimal" },
            body: JSON.stringify({
              user_id: USER_ID,
              unit_id: unitId,
              unit_data: unitData,
              updated_at: new Date().toISOString(),
            }),
          }
        );
        return res.ok;
      } catch { return false; }
    },

    // カスタム単元を全件読み込み
    loadCustomUnits: async () => {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/sapix_custom_units?user_id=eq.${USER_ID}&select=unit_id,unit_data`,
          { headers }
        );
        if (!res.ok) return null;
        const rows = await res.json();
        const result = {};
        for (const row of rows) result[row.unit_id] = row.unit_data;
        return result;
      } catch { return null; }
    },
  };
})();

{id:"sci601-c4-1",text:"(1) 実験A〜Fについて、①酸素、②二酸化炭素、③水素が発生するものをそれぞれすべて選びなさい",pts:10},
{id:"sci601-c4-2",text:"(2) 実験B〜Fについて、発生した①酸素、②二酸化炭素、③水素を集める方法を次のア〜オから選びなさい",pts:10},
{id:"sci601-c4-3",text:"(3) 試験管に集めた気体が①酸素、②二酸化炭素、③水素であることを確かめる方法と結果をそれぞれ答えなさい",pts:10},
{id:"sci601-c4-4",text:"(4) 発生した気体を集めるとき、最初に出てくる気体は集めなかったりします。これは最初に出てくる気体が何だからですか",pts:10},
]},
{id:"sci601-check5",label:"確認問題 [5] 6種類の水溶液をフローチャートで見分ける",diff:2,cat:"確認問題",problems:[
{id:"sci601-c5-1",text:"(1) 実験操作①〜③は、それぞれどのような操作を行いましたか（同じ記号を2回使用不可）",pts:10},
{id:"sci601-c5-2",text:"(2) 実験操作④では、2種類の水溶液を混ぜ合わせたときの変化から4種すべての水溶液が何であるかを知ることができました。どの水溶液とどの水溶液を混ぜ合わせたときですか",pts:10},
]},
{id:"sci601-check6",label:"確認問題 [6] 水溶液を決まりで分類する（ベン図）",diff:2,cat:"確認問題",problems:[
{id:"sci601-c6-1",text:"(1) 図1のA〜Hに当てはまる水溶液を、ア〜コからそれぞれすべて選びなさい",pts:10},
{id:"sci601-c6-2",text:"(2) 決まり①を「水分を蒸発させるとあとに何も残らない」に変えて分けると、分ける前と当てはまる場所が変わる水溶液はいくつありますか",pts:10},
{id:"sci601-c6-3",text:"(3) 決まり③を「青色リトマス紙を赤く変えない」に変えて分けると、分ける前と当てはまる場所が変わる水溶液はいくつありますか",pts:10},
]},

{id:"sci601-dc3-3",text:"(3) 次のア〜オから、卵の姿で越冬する昆虫をすべて選びなさい",pts:10},
{id:"sci601-dc3-4",text:"(4) スコットランドの化学者であるジョセフ・ブラックが「固定空気」と名付けた、石灰石を加熱することで発生する気体の名前を答えなさい",pts:10},

{id:"sci-607",code:"607",title:"太陽と月",isSpring:false,
sections:[
{id:"s07-t1",label:"テーマ1　月の満ち欠け・旧暦・名前",diff:1,cat:"月の形・十五夜・三日月・スーパームーン",problems:[
{id:"s07-1-1",text:"月の満ち欠けをもとにした1か月のカレンダー：新月（月齢0）を1日として月齢14（満月）・月齢22（下弦）の月の形を答えなさい",pts:5},
{id:"s07-1-2",text:"十五夜は旧暦何月何日か。「中秋の名月」の呼び名と，十三夜の月が「薬名」とも呼ばれる理由を答えなさい",pts:5},
{id:"s07-1-3",text:"三日月は夕方に西の空に見える。二十七日の月は明け方に東の空に見える。その理由を月の公転と関連させて説明しなさい",pts:5},
{id:"s07-1-4",text:"スーパームーンとマイクロムーンの違いを，月の公転軌道（楕円形）と関連させて説明しなさい",pts:5},
{id:"s07-1-5",text:"旧暦では新月を1日として1か月が29日または30日になる理由を答えなさい",pts:5},
]},
{id:"s07-t2",label:"テーマ2　日食・月食・地球から太陽までの距離",diff:2,cat:"日食・月食・アリスタルコス・コペルニクス・ガリレオ",problems:[
{id:"s07-2-1",text:"新月のとき日食が起こる仕組みを「太陽・月・地球の位置関係」で説明しなさい",pts:5},
{id:"s07-2-2",text:"満月のとき月食が起こる仕組みを説明しなさい。皆既月食のとき月が赤く見える理由も答えなさい",pts:5},
{id:"s07-2-3",text:"アリスタルコスは上弦の月（半月）のとき，太陽・月・地球がつくる角度が87度であることから，地球から太陽までの距離を求めた。その方法を説明しなさい",pts:5},
{id:"s07-2-4",text:"「地球から月までの距離：月の大きさ＝地球から太陽までの距離：太陽の大きさ」という関係から分かることを説明しなさい",pts:5},
{id:"s07-2-5",text:"コペルニクスとガリレオが主張した地動説とはどのような考えか。天動説との違いも含めて説明しなさい",pts:5},
]},
{id:"s07-kiso",label:"授業の確認問題 基礎編",diff:1,cat:"太陽と月・基礎",problems:[
{id:"sci607-k-1",text:"月齢7（上弦の月）・月齢14（満月）・月齢22（下弦の月）の月の形を答えなさい",pts:5},
{id:"sci607-k-2",text:"日食と月食の違いを図を用いて説明しなさい",pts:5},
{id:"sci607-k-3",text:"スーパームーンが起きる理由を答えなさい",pts:5},
]},
{id:"s07-hatten",label:"授業の確認問題 発展編",diff:2,cat:"太陽と月・発展",problems:[
{id:"s07-h-1",text:"アリスタルコスの方法：上弦の月のとき角度が87度であることから，地球から太陽までの距離を求める計算の考え方を説明しなさい",pts:10},
{id:"s07-h-2",text:"地動説が長い間受け入れられなかった理由と，ガリレオが地動説を支持した根拠を答えなさい",pts:10},
]},
{id:"s07-step",label:"デイリーステップ（太陽と月）",diff:1,cat:"月・日食・月食の確認",problems:[
{id:"s07-s-1",text:"月の満ち欠けの周期は約何日か",pts:5},
{id:"s07-s-2",text:"旧暦8月15日の夜に見られる月を何と呼ぶか",pts:5},
{id:"s07-s-3",text:"地球から見た月と太陽の大きさがほぼ同じに見えるのはなぜか",pts:5},
{id:"s07-s-4",text:"科学の図鑑「月」：人類が初めて月に降り立った宇宙船の名前と年を答えなさい（アポロ11号・1969年）",pts:5},
]},
],initialAnswers:{}},
{id:"sci-608",code:"608",title:"人体",isSpring:false,
sections:[
{id:"s08-t1",label:"テーマ1　消化・吸収",diff:1,cat:"消化管・消化酵素・栄養素",problems:[
{id:"s08-1-1",text:"食べ物が消化される順序（口→食道→胃→小腸→大腸）と各器官のはたらきを答えなさい",pts:5},
{id:"s08-1-2",text:"だ液・胃液・すい液にそれぞれ含まれる消化酵素の名前と分解する栄養素を答えなさい",pts:5},
{id:"s08-1-3",text:"小腸の柔毛のはたらきと，ブドウ糖・アミノ酸・脂肪酸が吸収される経路を答えなさい",pts:5},
{id:"s08-1-4",text:"三大栄養素（炭水化物・タンパク質・脂肪）が最終的に何に分解されるかそれぞれ答えなさい",pts:5},
]},
{id:"s08-t2",label:"テーマ2　呼吸・血液循環・排出",diff:1,cat:"肺・心臓・腎臓",problems:[
{id:"s08-2-1",text:"肺のつくり（肺胞）と，酸素・二酸化炭素が交換される仕組みを説明しなさい",pts:5},
{id:"s08-2-2",text:"心臓の4つの部屋（左心房・左心室・右心房・右心室）と血液の流れを説明しなさい",pts:5},
{id:"s08-2-3",text:"肺循環と体循環の違いを説明しなさい",pts:5},
{id:"s08-2-4",text:"動脈血と静脈血の違いを酸素量と流れる血管で答えなさい",pts:5},
{id:"s08-2-5",text:"腎臓のはたらき（血液中の不要物をこしとって尿をつくる）を説明しなさい",pts:5},
{id:"s08-2-6",text:"血液の成分（赤血球・白血球・血小板・血しょう）とそれぞれのはたらきを答えなさい",pts:5},
]},
{id:"s08-t3",label:"科学の図鑑　恒星（星の一生・HR図）",diff:2,cat:"恒星・絶対等級・主な恒星の分類",problems:[
{id:"s08-3-1",text:"恒星とは何か。太陽は恒星か惑星かを答えなさい",pts:5},
{id:"s08-3-2",text:"星の一生を順番に並べなさい（原始星→主系列星→巨星→白色わい星→中性子星・ブラックホール）",pts:5},
{id:"s08-3-3",text:"絶対等級とみかけの等級の違いを説明しなさい（約32.6光年の距離で比較）",pts:5},
{id:"s08-3-4",text:"HR図（ヘルツシュプルング・ラッセル図）の縦軸（絶対等級）と横軸（恒星の色）が何を表すか答えなさい",pts:5},
{id:"s08-3-5",text:"シリウスの特徴（距離・色・みかけの等級）を答えなさい",pts:5},
{id:"s08-3-6",text:"ベテルギウスが赤色巨星であり，まもなく超新星爆発を起こすといわれている理由を答えなさい",pts:5},
]},
{id:"s08-kiso",label:"授業の確認問題 基礎編",diff:1,cat:"人体・基礎",problems:[
{id:"s08-k-1",text:"消化管を通る順序に並べなさい：小腸・大腸・胃・食道・口・肛門",pts:5},
{id:"s08-k-2",text:"心臓から全身に血液を送る順序：左心室→大動脈→全身→（　）→右心房，（　）に入る語句を答えなさい",pts:5},
{id:"s08-k-3",text:"腎臓でつくられた尿が体外に出るまでの経路（腎臓→輸尿管→膀胱→尿道）を答えなさい",pts:5},
]},

function calcStats(sections, answers) {
// sections/problems が null/undefined でも安全に動作する
if (!sections || !Array.isArray(sections)) return { correct:0, answered:0, total:0, pct:null };
let correct = 0, answered = 0, total = 0;
sections.forEach(s => {
if (!s || !Array.isArray(s.problems)) return;
s.problems.forEach(p => {
total++;
const a = answers[p.id];
if (a !== null && a !== undefined) { answered++; if (a === true) correct++; }
});
});
return { correct, answered, total, pct: answered === 0 ? null : Math.round(correct / answered * 100) };
}

function pctColor(pct) {
if (pct === null) return "#94a3b8";
if (pct >= 80) return "#22c55e";
if (pct >= 60) return "#f59e0b";
return "#ef4444";
}

function MiniRing({ pct, size = 44, stroke = 5 }) {
const r = (size - stroke) / 2;
const circ = 2 * Math.PI * r;
const fill = (pct ?? 0) / 100 * circ;
const col = pctColor(pct);
return (
<svg width={size} height={size} style={{ transform: "rotate(-90deg)", flexShrink: 0 }}>
<circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#e2e8f0" strokeWidth={stroke} />
<circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={stroke}
strokeDasharray={`${fill} ${circ}`} strokeLinecap="round"
style={{ transition: "stroke-dasharray 0.5s ease" }} />
<text x={size/2} y={size/2 + 4} textAnchor="middle" fill={col}
fontSize={size * 0.2} fontWeight="800"
style={{ transform: `rotate(90deg)`, transformOrigin: `${size/2}px ${size/2}px`, fontFamily: "monospace" }}>
{pct !== null ? `${pct}` : "—"}
</text>
</svg>
);
}

if(/算606|60-06/.test(n)&&!/H/.test(n)) return "math-61-06";
if(/算607|60-07|二量/.test(n)) return "math-61-07";
if(/算608|60-08|小数分数/.test(n)) return "math-61-08";

if(/国607|62A-07/.test(n)) return "japanese-62A-07";

// ファイル選択ハンドラ
const handleFileSelect = (e) => {
const file = e.target.files[0];
if(!file) return;
if(!file.name.toLowerCase().endsWith('.pdf')) {
setUploadMsg("PDFファイルを選択してください"); return;
}
if(file.size > 50*1024*1024) {
setUploadMsg("ファイルサイズが50MBを超えています"); return;
}
setUploading(true);

setNewUnitTitle(file.name.replace(/\.pdf$/i,""));

setUploading(false);

};
reader.onerror = () => { setUploading(false); setUploadMsg("読み込みに失敗しました"); };
reader.readAsDataURL(file);
e.target.value = "";
};

// PDFを保存
const savePdf = async (unitId) => {
if(!pendingFile || !unitId) return;
setUploading(true);
try {
const data = { name: pendingFile.name, dataUrl: pendingFile.dataUrl, size: pendingFile.size, savedAt: new Date().toISOString() };
await Storage.set(`pdf_upload_${unitId}`, JSON.stringify(data));
setUploadedPdfs(prev => ({...prev, [unitId]: data}));
setShowMapModal(false);
setShowNewUnit(false);
setPendingFile(null);
setUploadMsg(`✅ 保存しました`);
setTimeout(()=>setUploadMsg(""), 3000);
} catch(e) {
setUploadMsg("保存に失敗しました: " + e.message);
}
setUploading(false);
};

// 新規カスタム単元を作成してPDFを保存
const createAndSave = async () => {
if(!newUnitTitle.trim()) { setUploadMsg("単元名を入力してください"); return; }
if(!pendingFile) return;
const subjId = newUnitSubjId;
const existingCustom = Object.values(customUnits).filter(u=>u.subjId===subjId);
const num = existingCustom.length + 1;
const unitId = `custom-${subjId}-${Date.now()}`;
const subj = SUBJECTS.find(s=>s.id===subjId);
const code = `${subj?.label?.slice(0,1)||""}追加${String(num).padStart(2,"0")}`;

setUploading(true);
setUploadMsg("📖 PDFを解析中…");

// dataUrlからbase64とmedia_typeを取得
const dataUrl = pendingFile.dataUrl;
const mimeMatch = dataUrl.match(/^data:([^;]+);base64,/);
const mediaType = mimeMatch ? mimeMatch[1] : "application/pdf";
const base64Data = dataUrl.split(",")[1];

// PDF解析関数（リトライ付き）
const analyzePdf = async (attempt = 1) => {
const isRetry = attempt > 1;
if(isRetry) setUploadMsg(`🔄 再解析中…（${attempt}回目）`);

const prompt = attempt === 1
? `SAPIXのプリントPDFです。大問と小問の構成を読み取りJSONで返してください。

出力形式（JSONのみ・説明文不要）:
{"sections":[{"id":"s1","label":"大問1","diff":2,"cat":"確認問題","problems":[{"id":"s1-1","text":"(1)","pts":5},{"id":"s1-2","text":"(2)","pts":5}]}]}

ルール:
・大問ごとに1つのsectionを作る
・problemsのtextは問題番号（(1)(2)や①②など）
・diff:1=基本/2=標準/3=応用、pts:配点（不明なら5）
・idはs1,s1-1のような形式で必ずユニークにする
・JSONのみ返す`
: `このプリントの問題番号をすべて読み取ってください。
大問が何個あり、各大問に小問が何個あるか数えてJSONで返してください。

出力形式（JSONのみ）:
{"sections":[{"id":"s1","label":"大問1","diff":2,"cat":"問題","problems":[{"id":"s1-1","text":"(1)","pts":5}]}]}

JSONのみ返してください。`;

const resp = await fetch("https://api.anthropic.com/v1/messages", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
model: "claude-sonnet-4-20250514",
max_tokens: 2000,
messages: [{
role: "user",
content: [
{ type: "document", source: { type: "base64", media_type: mediaType, data: base64Data } },
{ type: "text", text: prompt }
]
}]
})
});

if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
const data = await resp.json();

if(data.error) throw new Error(data.error.message || "APIエラー");

const text = data.content?.[0]?.text || "";
if(!text) throw new Error("レスポンスが空");

// JSON部分を抽出
const jsonMatch = text.match(/\{[\s\S]*\}/);
if(!jsonMatch) throw new Error("JSONが見つからない");

const parsed = JSON.parse(jsonMatch[0]);
const sections = parsed.sections || [];
if(sections.length === 0) throw new Error("問題が読み取れなかった");

// IDの重複チェック・修正
const usedIds = new Set();
sections.forEach((sec, si) => {
if(!sec.id || usedIds.has(sec.id)) sec.id = `s${si+1}`;
usedIds.add(sec.id);
sec.problems?.forEach((p, pi) => {
const pid = `${sec.id}-${pi+1}`;
p.id = pid;
});
});

return sections;
};

let sections = null;
let errorMsg = "";

// 最大2回試行
for(let attempt = 1; attempt <= 2; attempt++) {
try {
sections = await analyzePdf(attempt);
break;
} catch(e) {
errorMsg = e.message;
if(attempt === 1) {
setUploadMsg(`⚠️ 1回目失敗（${e.message}）→ 再試行中…`);
await new Promise(r => setTimeout(r, 1000));
}
}
}

if(!sections) {
// 両方失敗 → 手動設定UIを表示
setUploading(false);

const pdf = uploadedPdfs[unitId];
const unit = customUnits[unitId];
if(!pdf || !unit) { setUploadMsg("PDFまたは単元情報が見つかりません"); return; }

setReAnalyzingId(unitId);
setUploadMsg(`📖 「${unit.title}」を再解析中…`);

const mimeMatch = pdf.dataUrl.match(/^data:([^;]+);base64,/);
const mediaType = mimeMatch ? mimeMatch[1] : "application/pdf";
const base64Data = pdf.dataUrl.split(",")[1];

// PDF解析（2回試行）
const analyze = async (attempt) => {
const prompt = attempt === 1
? `SAPIXのデイリーサポートプリントです。全ページの大問・小問の構成を読み取り、JSONで返してください。

出力形式（JSONのみ・説明文不要）:
{"sections":[{"id":"s1","label":"導入と基本①","diff":1,"cat":"分類","problems":[{"id":"s1-1","text":"[1](1)問題の内容を20字以内で","pts":5}]}]}

重要なルール:
・すべての大問をsectionとして含める（導入と基本・デイリーアプローチ・Daily Supportなど）
・各大問の小問を全てproblemsに含める
・textは問題内容を20字以内で（例：「[1](1)xとyの式を表せ」）
・diff:1=基本,2=標準,3=応用
・idは重複なしでs1,s1-1形式
・JSONのみ返す`
: `このプリントの問題番号を全て数えてJSONで返してください。大問と小問の構成のみ。

{"sections":[{"id":"s1","label":"大問1","diff":2,"cat":"問題","problems":[{"id":"s1-1","text":"(1)","pts":5}]}]}

JSONのみ。`;

const resp = await fetch("https://api.anthropic.com/v1/messages", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
model: "claude-sonnet-4-20250514",
max_tokens: 4000,
messages: [{
role: "user",
content: [
{ type: "document", source: { type: "base64", media_type: mediaType, data: base64Data } },
{ type: "text", text: prompt }
]
}]
})
});
if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
const data = await resp.json();
if(data.error) throw new Error(data.error.message);
const text = data.content?.[0]?.text || "";
const m = text.match(/\{[\s\S]*\}/);
if(!m) throw new Error("JSONなし");
const parsed = JSON.parse(m[0]);
const sections = parsed.sections || [];
if(sections.length === 0) throw new Error("問題なし");
// ID重複修正
const used = new Set();
sections.forEach((sec, si) => {
if(!sec.id || used.has(sec.id)) sec.id = `s${si+1}`;
used.add(sec.id);
(sec.problems||[]).forEach((p, pi) => { p.id = `${sec.id}-${pi+1}`; });
});
return sections;
};

let sections = null;
let errMsg = "";
for(let attempt = 1; attempt <= 2; attempt++) {
try {
sections = await analyze(attempt);
break;
} catch(e) {
errMsg = e.message;
if(attempt === 1) {
setUploadMsg(`⚠️ 1回目失敗→再試行中…`);
await new Promise(r=>setTimeout(r,1000));
}
}
}

if(!sections) {
setUploadMsg(`❌ 再解析失敗（${errMsg}）手動で問題数を設定してください`);
setShowManualSetup({ unitId, code: unit.code, subjId: unit.subjId, title: unit.title });
setReAnalyzingId(null);
return;
}

// 更新した単元を保存
const updatedUnit = { ...unit, sections };
const nextCustom = { ...customUnits, [unitId]: updatedUnit };
try {
await Storage.set("custom_units", JSON.stringify(nextCustom));
setCustomUnits(nextCustom);
const total = sections.reduce((a,s)=>a+s.problems.length,0);
setUploadMsg(`✅ 再解析完了！${sections.length}大問・${total}問 を「進捗管理」に反映しました`);
setTimeout(()=>setUploadMsg(""),5000);
} catch(e) {
setUploadMsg("保存失敗: " + e.message);
}
setReAnalyzingId(null);
};

{id:"p-k-m-2-5",subject:"math",field:"年齢算・逆算",pts:6,question:"Aさんは，所持金の1/3より200円少ない金額で本を買い，次に残ったお金の中から1000円で文房具を買いました。すると，最後に残ったお金は，はじめの所持金の2/5でした。はじめの所持金は□円です。",answer:"3000"},
{id:"p-k-m-2-6",subject:"math",field:"平均",pts:6,question:"35人のクラスで算数のテストを行ったところ，クラス全体の平均点は60点でした。また，得点上位10人の平均点と，残り25人の平均点には14点の差がありました。得点上位10人の平均点は□点です。",answer:"70"},
{id:"p-k-m-3-1",subject:"math",field:"角度（正五角形・正三角形）",pts:6,question:"正五角形と正三角形が重なっています。㋐の角の大きさは□度です。（正五角形の内角108度，正三角形の内角60度）",answer:"48"},
{id:"p-k-m-3-2",subject:"math",field:"図形（面積の比）",pts:6,question:"三角形ABCの面積を直線BD，DF，FE，EGで5等分しました。ADの長さは□cmです。（BCとEGは6cm）",answer:"2と1/4"},
{id:"p-k-m-3-3",subject:"math",field:"立体図形（展開図・体積）",pts:6,question:"展開図を組み立てて直方体を作ります。この直方体の体積は□cm³です。（18cm×22cm×10cmから求める）",answer:"720"},
{id:"p-k-m-3-4",subject:"math",field:"平面図形（円・面積）",pts:6,question:"面積が8cm²の正方形5つと円を組み合わせたものです。まん中の正方形の頂点はすべて円周上にあります。斜線部分の面積の合計は□cm²です。（π=3.14）",answer:"27.44"},
{id:"p-k-m-3-5",subject:"math",field:"平面図形（長方形・面積）",pts:6,question:"たて30cm，横48cmの長方形ABCDです。点E，FはそれぞれADを3等分する点で，直線ECと直線BFの交点をG，直線ECと対角線BDの交点をHとします。三角形GBHの面積は□cm²です。",answer:"108"},
{id:"p-k-m-4-1",subject:"math",field:"損益算",pts:6,question:"あるパン屋では，カレーパンを毎日180個作り，1個240円の定価で販売しますが，残り30個になると，定価の半額にして売りつくしています。カレーパンの原価が1個100円のとき，180個すべて売りつくしたときの利益は何円ですか。",answer:"21600円"},
{id:"p-k-m-4-2",subject:"math",field:"損益算",pts:6,question:"カレーパンを180個すべて売りつくしたときの利益が24300円になるとき，カレーパンの原価は1個何円ですか。",answer:"85円"},
{id:"p-k-m-4-3",subject:"math",field:"損益算",pts:6,question:"カレーパンを180個すべて売りつくしたとき，定価で売った分の利益の合計が，半額で売った分の利益の合計の20倍になりました。このときのカレーパンの原価は1個何円ですか。",answer:"80円"},
{id:"p-k-m-5-1",subject:"math",field:"速さ（追い越し）",pts:6,question:"A君は10時にX町を出発し毎分60mでY町に向かいました。B君は10時15分にX町を出発し毎分150mでY町に向かいました。C君はB君がX町を出発するのと同時にY町を出発し毎分120mでX町に向かいました。B君はA君を追い越した6分後にC君と出会いました。B君がA君を追い越したのは10時何分ですか。",answer:"10時25分"},
{id:"p-k-m-5-2",subject:"math",field:"速さ（出会い）",pts:6,question:"上の問題で，A君とC君が出会ったのは，10時何分ですか。",answer:"10時34分"},
{id:"p-k-m-6-1",subject:"math",field:"水量変化（グラフ）",pts:6,question:"給水管Aと排水管Bがついた直方体の容器があります。容器が空の状態から，Aを開いて水を入れ，その5分後にBも開いて水を出し始めました。しかし，途中でBが故障し排水できなくなったため，すぐに修理して，修理を始めてから2分後に排水を再開しました。（容器は底面40cm×30cm，高さ20cm）Aから給水される水は，毎分何Lですか。",answer:"3.6L"},
{id:"p-k-m-6-2",subject:"math",field:"水量変化（グラフ）",pts:6,question:"上の問題で，Bから排水される水は，毎分何Lですか。",answer:"6.4L"},
{id:"p-k-m-6-3",subject:"math",field:"水量変化（グラフ）",pts:6,question:"上の問題で，グラフのア（修理後排水再開直後の水面の高さ）にあてはまる数を求めなさい。",answer:"14"},

  })()}

)}

// ============================================================
// メインアプリ（ホーム＋デイリーサポート統合）
// ============================================================
function App() {
const [screen, setScreen] = useState("home");   // "home" | "daily"
const [page, setPage] = useState("dashboard");
const [selectedSubject, setSelectedSubject] = useState(null);
const [selectedUnit, setSelectedUnit] = useState(null);
const [allAnswers, setAllAnswers] = useState({});
const [downloading, setDownloading] = useState(false);
const [dlDone, setDlDone] = useState(false);
const [saveStatus, setSaveStatus] = useState("idle"); // "idle"|"saving"|"saved"|"error"
const saveTimerRef = React.useRef(null);
// 最新のallAnswersをRefで追跡（非同期保存で最新値を確実に使うため）
const allAnswersRef = React.useRef({});

// ── 回答の読み込み（全バックエンドから読み込みマージ・データ消失防止）──
useEffect(() => {
(async () => {
try {
  setSaveStatus("saving");
  // 1. Supabaseから読み込み（設定済みの場合）
  if (supabase) {
    const cloudData = await supabase.loadAnswers();
    if (cloudData) {
      const count = Object.values(cloudData).reduce((a,u)=>a+Object.keys(u||{}).length,0);
      console.log('[SAPIX] Supabaseから読み込み:', count, '問');
      allAnswersRef.current = cloudData;
      setAllAnswers(cloudData);
      try { await Storage.set("sapix_all_answers", JSON.stringify(cloudData)); } catch {}
      setSaveStatus("idle");
      const cu = await supabase.loadCustomUnits();
      if (cu && Object.keys(cu).length > 0) {
        const sanitized = {};
        for (const [k, v] of Object.entries(cu)) sanitized[k] = sanitizeUnit({...v}) || v;
        setCustomUnits(sanitized);
      }
      return;
    }
  }
  // 2. ローカルから読み込み（フォールバック）
  let bestData = null;
  let bestCount = -1;
  const loaders = [
    async () => { try { const r = await Storage.get("sapix_all_answers"); return r ? JSON.parse(r.value) : null; } catch { return null; } },
    async () => { try { const v = localStorage.getItem("sapix_all_answers"); return v ? JSON.parse(v) : null; } catch { return null; } },
    async () => { try { if (window.storage) { const r = await window.storage.get("sapix_all_answers", true); return r ? JSON.parse(r.value) : null; } } catch {} return null; },
  ];
  for (const load of loaders) {
    const data = await load();
    if (data && typeof data === 'object') {
      const count = Object.values(data).reduce((a,u)=>a+Object.keys(u||{}).length,0);
      if (count > bestCount) { bestCount = count; bestData = data; }
    }
  }
  if (bestData && bestCount > 0) {
    console.log('[SAPIX] ローカルから読み込み:', bestCount, '問');
    allAnswersRef.current = bestData;
    setAllAnswers(bestData);
  }
} catch(e) {
  console.warn('[SAPIX] 読み込みエラー:', e);
}
setSaveStatus("idle");
if (!allAnswersRef.current) { allAnswersRef.current = {}; }
})();
}, []);

// ページを離れる前にも確実に保存
useEffect(() => {
const save = () => {
const data = allAnswersRef.current;
if (Object.keys(data).length > 0) {
// beacon API で同期的に保存を試みる（非同期不可の場合）
try {
Storage.set("sapix_all_answers", JSON.stringify(data));
} catch {}
}
};
window.addEventListener("beforeunload", save);
window.addEventListener("pagehide", save);
return () => {
window.removeEventListener("beforeunload", save);
window.removeEventListener("pagehide", save);
};
}, []);

// ── 回答の保存（全バックエンドへの冗長書き込み・データ消失防止）──
const saveAllAnswers = async (data) => {
setSaveStatus("saving");
const json = JSON.stringify(data);
let anySuccess = false;
const writes = [
  // 1. Supabase（クラウド・最優先）
  (async () => {
    if (!supabase) return false;
    try { return await supabase.saveAllAnswers(data); } catch { return false; }
  })(),
  // 2. IndexedDB / Storage
  (async () => {
    for (let i = 0; i < 3; i++) {
      try { const r = await Storage.set("sapix_all_answers", json); if (r != null) return true; } catch {}
      await new Promise(r => setTimeout(r, 100));
    }
    return false;
  })(),
  // 3. localStorage
  (async () => { try { localStorage.setItem("sapix_all_answers", json); return true; } catch { return false; } })(),
  // 4. window.storage shared
  (async () => { try { if (window.storage) { const r = await window.storage.set("sapix_all_answers", json, true); return r != null; } } catch {} return false; })(),
];
const results = await Promise.allSettled(writes);
anySuccess = results.some(r => r.status === 'fulfilled' && r.value === true);
if (anySuccess) {
  setSaveStatus("saved");
  if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
  saveTimerRef.current = setTimeout(() => setSaveStatus("idle"), 3000);
} else {
  setSaveStatus("error");
  console.error("[SAPIX] 全バックエンドへの保存失敗");
}
return anySuccess;
};
// ── 単元選択ハンドラ ──
const handleSelectUnit = (subj, unit) => {
setSelectedSubject(subj);
setSelectedUnit(unit);
setPage("detail");
};


// ── 正誤変更ハンドラ（Supabase + ローカル保存）──
const handleAnswerChange = (pid, value) => {
const unitId = selectedUnit?.id;
if (!unitId) return;
const prev = allAnswersRef.current;
const next = {
  ...prev,
  [unitId]: { ...(prev[unitId] || {}), [pid]: value },
};
// nullの場合はキーを削除
if (value === null) {
  next[unitId] = { ...(prev[unitId] || {}) };
  delete next[unitId][pid];
}
allAnswersRef.current = next;
setAllAnswers(next);
// Supabaseに個別保存（最速）
if (supabase && value !== null) {
  supabase.saveAnswer(unitId, pid, value).catch(() => {});
}
// 全バックエンドに保存
saveAllAnswers(next);
};


const AutoSaveBar = () => {
const cfg = {
saving: { color: "#fbbf24", dot: "#fbbf24", text: "保存中…" },
saved:  { color: "#22c55e", dot: "#22c55e", text: "✓ 保存しました" },
error:  { color: "#f87171", dot: "#f87171", text: "⚠ 保存エラー（再試行中）" },
idle:   { color: "#22c55e", dot: "#22c55e", text: "自動保存 ON" },
}[saveStatus] || { color: "#22c55e", dot: "#22c55e", text: "自動保存 ON" };
return (
<div style={{
position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 1000,
background: "linear-gradient(135deg, #0f172a, #1e293b)",
borderTop: "1px solid #334155",
padding: "6px 16px",
display: "flex", alignItems: "center", justifyContent: "space-between",
}}>
<span style={{ fontSize: 10, color: cfg.color, fontFamily: "'Noto Sans JP',sans-serif", display:"flex", alignItems:"center", gap:5 }}>
<span style={{width:6,height:6,borderRadius:"50%",background:cfg.dot,display:"inline-block",
animation: saveStatus==="saving" ? "pulse 0.8s ease-in-out infinite" : "none"}}/>
{cfg.text}
</span>
<span style={{ fontSize: 9, color: "#475569" }}>
{Object.keys(allAnswers).length > 0 ? `${Object.values(allAnswers).reduce((a,u)=>a+Object.keys(u).length,0)}問 記録済み` : ""}
</span>
</div>
);
};

if (screen === "home") {
return (
<div>
<style>{`@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@700&display=swap'); *{box-sizing:border-box;}`}</style>
<HomeScreen onOpenDaily={() => setScreen("daily")} allAnswers={allAnswers} />
</div>
);
}

if (page === "detail" && selectedSubject && selectedUnit) {
return (
<div>
<style>{`@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@700&display=swap'); *{box-sizing:border-box;}`}</style>
<DetailPage
unit={selectedUnit}
subject={selectedSubject}
answers={allAnswers[selectedUnit.id] || {}}
onChange={handleAnswerChange}
onBack={() => setPage("dashboard")}
/>
<AutoSaveBar />
</div>
);
}

return (
<div>
<Dashboard allAnswers={allAnswers} onSelectUnit={handleSelectUnit} onGoHome={() => setScreen("home")} />
<AutoSaveBar />
</div>
);
}


ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
hideLoading();
</script>
</body>
