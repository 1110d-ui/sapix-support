<script>window.storage=(()=>{const DB='sapix_v2',ST='kv';let db=null;
const open=()=>new Promise((r,e)=>{if(db){r(db);return;}const q=indexedDB.open(DB,1);
q.onupgradeneeded=v=>v.target.result.createObjectStore(ST);
q.onsuccess=v=>{db=v.target.result;r(db);};q.onerror=()=>e(q.error);});
const run=async(m,f)=>{const d=await open();return new Promise((r,e)=>{
const t=d.transaction(ST,m),s=t.objectStore(ST),q=f(s);
if(q){q.onsuccess=()=>r(q.result);q.onerror=()=>e(q.error);}
else{t.oncomplete=()=>r();t.onerror=()=>e(t.error);}});};
return{
get:async k=>{try{const v=await run('readonly',s=>s.get(k));return v!==undefined?{key:k,value:v}:null;}catch{return null;}},
set:async(k,v)=>{try{await run('readwrite',s=>s.put(v,k));return{key:k,value:v};}catch{return null;}},
delete:async k=>{try{await run('readwrite',s=>s.delete(k));return{key:k,deleted:true};}catch{return null;}},
list:async(p='')=>{try{const ks=await run('readonly',s=>s.getAllKeys());return{keys:(ks||[]).filter(k=>String(k).startsWith(p))};}catch{return{keys:[]};}}
};})();</script>

function setLoadMsg(m){var e=document.getElementById("load-msg");if(e)e.textContent=m;}
function hideLoading(){var e=document.getElementById("loading");if(e){e.classList.add("hide");setTimeout(function(){if(e)e.style.display="none";},300);}}
window.onerror=function(msg,src,line){setLoadMsg("Error: "+msg);return false;};
setTimeout(function(){var e=document.getElementById("loading");if(e&&!e.classList.contains("hide"))setLoadMsg("時間がかかっています。Wi-Fiを確認してください。");},20000);
if("serviceWorker"in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("/sapix-support/sw.js").catch(()=>{});}

const CURRENT_VERSION = '20260923-066';
async function checkForUpdate(){if(!navigator.onLine)return;try{const res=await fetch('/',{cache:'no-store'});const text=await res.text();const m=text.match(/CURRENT_VERSION = '([^']+)'/);if(m&&m[1]&&m[1]!==CURRENT_VERSION)showUpdateBanner();}catch(e){}}
function showUpdateBanner(){if(document.getElementById('update-banner'))return;const b=document.createElement('div');b.id='update-banner';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:linear-gradient(135deg,#059669,#0d9488);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;font-family:-apple-system,sans-serif;box-shadow:0 2px 12px rgba(0,0,0,.3);';b.innerHTML='<div style="color:white;font-size:13px;font-weight:700">🆕 新しいバージョンがあります</div><button id="update-btn" style="background:white;color:#059669;border:none;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;">今すぐ更新</button>';document.body.prepend(b);document.getElementById('update-btn').addEventListener('click',async()=>{const btn=document.getElementById('update-btn');btn.textContent='更新中...';btn.disabled=true;try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}catch(e){}window.location.reload(true);});}
setTimeout(checkForUpdate,3000);
</script>

{id:"sci-606-k1-1",text:"(1)A・B・Cの各部分の名前",pts:10},{id:"sci-606-k1-2",text:"(2)最も温度が高いのはA〜Cのどこか",pts:10},
{id:"sci-606-k1-3",text:"(3)最も明るいのはA〜Cのどこか",pts:10},{id:"sci-606-k1-4",text:"(4)細いガラス管のロを炎の中に入れると白い煙が出るのはA〜Cのどこか",pts:10},

]},

{id:"sci-606-k2-2",text:"(2)実験②で炎が小さくなった理由（ア〜ウから1つ）",pts:20},

{id:"sci-606-k2-6",text:"(6)ろうそくでは、固体・液体・気体のうちどの状態のろうが燃えているか",pts:20},
]},

{id:"sci-606-k3-1",text:"(1)木炭以外にも何種類かのものがでてきた→①②に当てはまる物体（ア〜ウから1つ）",pts:10},
{id:"sci-606-k3-2",text:"(2)図1の試験管のロが少し下がっている理由としてふさわしいものをア〜エから1つ",pts:10},
{id:"sci-606-k3-3",text:"(3)ものが燃えるためには「燃える物があること」「酸素が十分にあること」「発火点以上の温度であること」の3つの条件が必要→図1の実験で欠けているものと同じものが欠けているために起こる現象（ア〜エから1つ）",pts:10},
]},

{id:"sci-606-k4-1",text:"(1)A〜Fの気体の名前",pts:10},{id:"sci-606-k4-2",text:"(2)水上置換で集められるもの（すべて選ぶ）",pts:10},

{id:"sci-606-k8",label:"確認問題⑧（5種類の固体の粉末A〜E・3種類の水溶液実験）",diff:1,cat:"確認問題",problems:[

]},

{id:"sci-606-k10-3",text:"(3)判断できないものを見分ける実験方法2つ",pts:10},
]},
{id:"sci-606-k11",label:"確認問題⑪（試験管・ガラス管を使って割りばしを加熱）",diff:2,cat:"確認問題",problems:[
{id:"sci-606-k11-1",text:"(1)木炭以外にも何種類かのものがでてきた→①②に当てはまる物体名",pts:10},
{id:"sci-606-k11-2",text:"(2)①木炭と②スチールウールが燃える様子をそれぞれ簡単に説明",pts:10},
{id:"sci-606-k11-3",text:"(3)下線部について、燃焼後に重くなった理由として正しいものをア〜エから2つ",pts:10},
{id:"sci-606-k11-4",text:"(4)①木炭と②スチールウールの燃焼後、それぞれの集気びんに残った気体の量の説明として正しいものをア〜カから2つ選ぶ",pts:10},
{id:"sci-606-k11-5",text:"(5)下線部④について、直方体の形をした鉄を燃焼させるとスチールウールのときとは異なり燃焼後の重さはほとんど変化していませんでした→理由を簡単に説明",pts:10},
{id:"sci-606-k11-6",text:"(6)木炭とスチールウールの燃焼後、それぞれの集気びんに残った気体の量の説明として正しいものをア〜カから2つ選ぶ",pts:10},
{id:"sci-606-k11-7",text:"(7)直方体の形をした鉄を燃焼させると燃焼後の重さがほとんど変化しなかった理由を簡単に説明",pts:10},
]},
{id:"sci-606-k12",label:"確認問題⑫（ものが燃えるという現象について実験）",diff:2,cat:"確認問題",problems:[
{id:"sci-606-k12-1",text:"(1)スチールウールの①燃やす前の性質と②燃やしたあとの性質としてふさわしいものをA〜オからそれぞれ2つ選ぶ",pts:10},
{id:"sci-606-k12-2",text:"(2)【実験2】で燃焼ビンの中の水面が上がったのはなぜか（A〜エから1つ）",pts:10},
{id:"sci-606-k12-3",text:"(3)【実験3】の（あ）と（い）に当てはまる気体の名前をそれぞれ答えなさい",pts:10},
{id:"sci-606-k12-4",text:"(4)(3)の（あ）と（い）で答えた気体の性質をA〜エからそれぞれ1つ選ぶ",pts:10},
{id:"sci-606-k12-5",text:"(5)【考察3】の（X）に当てはまる気体は（あ）または（い）のどちらか",pts:10},
{id:"sci-606-k12-6",text:"(6)【実験2】および【実験3】の結果について最もふさわしいものをA〜エから1つ選ぶ",pts:10},
{id:"sci-606-k12-7",text:"(7)同じ実験を水ではなく石灰水で行ったとき水面の上がり方はどうなるか（A〜ウから1つ）",pts:10},
]},
{id:"sci-606-h1",label:"発展問題①（現在私たちの身のまわりにある金属の利用の歴史）",diff:3,cat:"発展問題",problems:[
{id:"sci-606-h1-1",text:"(1)下線部Aの原因となることを1つ選ぶ",pts:20},
{id:"sci-606-h1-2",text:"(2)（あ）に当てはまる物質の名前を漢字で答えなさい",pts:20},
{id:"sci-606-h1-3",text:"(3)砂鉄と木炭に空気を送り込んで加熱すると、鋼のほかに二酸化炭素も発生する→（い）に当てはまる語句",pts:20},
{id:"sci-606-h1-4",text:"(4)（い）に当てはまる物質の名前を漢字2文字で答えなさい",pts:20},

]},

{id:"sci-606-h2-1",text:"(1)この実験で石灰水の代わりに使ってもよいのはどれか（ア〜エから1つ）",pts:20},

{id:"sci-606-h2-3",text:"(3)木炭1.25gが燃えるのに必要な酸素は何gか（木炭が燃焼した後に残った物質は反であり、酸素とは反応しないとします）",pts:20},
{id:"sci-606-h2-4",text:"(4)ろうは炭素と水素のみを成分としているとします。ろう1.41gに含まれている炭素と水素はそれぞれ何gか",pts:20},

]},
{id:"sci-6H01-k10",label:"確認問題⑩（部品を組み合わせてパズルのように回路をつくる）",diff:2,cat:"確認問題",problems:[
{id:"sci-6H01-k10-1",text:"(1)図2の電気回路と同じ豆電球の明るさになる回路は図1の部品を1つずつ選んで組み合わせ→ふさわしい組み合わせをア〜オから選ぶ",pts:25},
{id:"sci-6H01-k10-2",text:"(2)①AとCを入れかえると豆電球はどうなるか（ア〜エ）",pts:20},
{id:"sci-6H01-k10-3",text:"(2)②BとDも入れかえたとき→この回路についての説明としてふさわしいものをア〜エから選ぶ",pts:20},
{id:"sci-6H01-k10-4",text:"(3)図2のA〜Dの部品をかえて豆電球が最も明るくつく回路をつくる。豆電球⑫〜⑭の部品・乾電池⑮〜⑰の部品をそれぞれ2つ選んで使い必要な部品を図1の⑫〜⑰から4つ選ぶ",pts:20},
{id:"sci-6H01-k10-5",text:"(4)図2の回路に流れる電流を1としたとき(3)の回路に流れる電流の大きさを答えなさい",pts:15},
]},
{id:"sci-6H01-k11",label:"確認問題⑪（9スイッチ6豆電球の複雑回路・回路表）",diff:3,cat:"確認問題",problems:[
{id:"sci-6H01-k11-1",text:"(1)電流とは回路に流れる電のことです。電流を流すはたらきを何というか（漢字）",pts:10},
{id:"sci-6H01-k11-2",text:"(2)回路1の電池に流れる電流の大きさを1とすると回路6の電池に流れる電流の大きさはいくつか",pts:10},
{id:"sci-6H01-k11-3",text:"(3)回路1全体の電気抵抗の大きさを1とすると回路3と回路5の回路全体の電気抵抗の大きさはそれぞれいくつか",pts:10},
{id:"sci-6H01-k11-4",text:"(4)回路1の豆電球Bと同じ明るさになる豆電球をすべて選び解答例にならって答えなさい",pts:10},
{id:"sci-6H01-k11-5",text:"(5)2Eと同じ明るさになる豆電球は2Eをふくめず何個あるか",pts:10},
{id:"sci-6H01-k11-6",text:"(6)3Cと同じ明るさになる豆電球をすべて選び解答例にならって答えなさい",pts:10},
{id:"sci-6H01-k11-7",text:"(7)回路1〜7の中で最も明るくつく豆電球をすべて選び解答例にならって答えなさい",pts:10},
{id:"sci-6H01-k11-8",text:"(8)回路1〜7の中で最も暗くつく豆電球をすべて選び解答例にならって答えなさい（ついていないものは除く）",pts:10},
{id:"sci-6H01-k11-9",text:"(9)電池が最も長持ちするのはどの回路か。回路の番号で答えなさい",pts:10},
]},
{id:"sci-6H01-k12",label:"確認問題⑫（電流計の使い方・図1〜12の回路で電流計ア〜キの値）",diff:2,cat:"確認問題",problems:[
{id:"sci-6H01-k12-1",text:"(1)①電流計が正しくつながれた回路としてふさわしいものをア〜エから1つ",pts:20},
{id:"sci-6H01-k12-2",text:"(1)②500mAの一端子で測定したとき電流計の針が図のようになった→電流の大きさは何mA",pts:10},
{id:"sci-6H01-k12-3",text:"(2)最も暗く光る豆電球を含む回路を図1〜6から1つ",pts:10},
{id:"sci-6H01-k12-4",text:"(3)最も長い時間光る豆電球を含む回路を図1〜6から1つ",pts:10},
{id:"sci-6H01-k12-5",text:"(4)光らない豆電球がある回路を図1〜6から1つ",pts:10},
{id:"sci-6H01-k12-6",text:"(5)豆電球が光る回路の中で電流計の示す値が最も大きくなる回路を図1〜6から1つ",pts:10},
{id:"sci-6H01-k12-7",text:"(6)表のX・Yに当てはまる値をそれぞれ数字で答えなさい",pts:10},
{id:"sci-6H01-k12-8",text:"(7)図12の電流計キの示す値（表のZ）を①〜④に当てはまる数値を整数または分数で",pts:20},
]},
{id:"sci-6H01-k13",label:"確認問題⑬（ダイオードを使った回路）",diff:3,cat:"確認問題",problems:[
{id:"sci-6H01-k13-1",text:"(1)図3のア〜エの回路中の電球A〜Dについて回路ごとに光る電球をすべて選びA〜Dの記号で答えなさい（光らない回路はXを答える）",pts:20},
{id:"sci-6H01-k13-2",text:"(2)図3のア〜エの回路中の乾電池をすべて逆向きにしたとき電球が4つつく回路をすべて選びア〜エの記号で答えなさい",pts:80},
]},
{id:"sci-6H01-k14",label:"確認問題⑭（LED回路・3Pスイッチ）",diff:3,cat:"確認問題",problems:[
{id:"sci-6H01-k14-1",text:"(1)図2〜4の回路についてLEDが点灯するものをそれぞれA〜Eからすべて選び記号で答えなさい",pts:20},
{id:"sci-6H01-k14-2",text:"(2)Xに乾電池をどの向きにつないでも真ん中のYのLEDが点灯するような回路をア〜エからすべて選び記号で答えなさい",pts:20},
{id:"sci-6H01-k14-3",text:"(3)図5の回路で点線で囲まれた部分①〜④に4つのLEDを特定の向きにつなぐことでスイッチを接点1か接点2のどちらにつないでもZのLEDが点灯する→4つのLEDはどのようにつなげばよいか（ア・イの記号でそれぞれ答える）",pts:60},
]},
{id:"sci-6H01-h1",label:"発展問題①（複雑な回路・2つのスイッチ）",diff:3,cat:"発展問題",problems:[
{id:"sci-6H01-h1-1",text:"(1)図1・図2でつかない豆電球をすべて選びなさい（図2のスイッチは入っていない状態）",pts:20},
{id:"sci-6H01-h1-2",text:"(2)図1でもっとも明るい豆電球をすべて選びなさい",pts:20},
{id:"sci-6H01-h1-3",text:"(3)図2でスイッチ1だけを入れるとすべての豆電球がついた→豆電球を明るさが明るい順に並べなさい",pts:20},
{id:"sci-6H01-h1-4",text:"(4)図2でスイッチ2だけを入れた場合もっとも明るくついている豆電球に流れる電流の大きさはもっとも暗くついている豆電球に流れる電流の何倍か",pts:20},
{id:"sci-6H01-h1-5",text:"(5)図2でスイッチ1とスイッチ2を両方入れたとき、GのHとI・J・Kの電流はそれぞれいくつ（流れないときは0）",pts:20},
]},
{id:"sci-6H01-h2",label:"発展問題②（3Pスイッチと階段スイッチ）",diff:3,cat:"発展問題",problems:[
{id:"sci-6H01-h2-1",text:"(1)(ア)〜(キ)にそれぞれ1つ選び記号で答えなさい（3Pスイッチで豆電球III・IVの変化）",pts:50},
{id:"sci-6H01-h2-2",text:"(2)階段の電気を表す回路図に3Pスイッチと導線を加えて回路図を完成させなさい",pts:50},
]},
{id:"sci-6H01-ds1",label:"デイリーステップ①（電気の確認）",diff:1,cat:"デイリーステップ",problems:[
{id:"sci-6H01-ds1-1",text:"①直列回路の電流・電圧の特徴",pts:10},{id:"sci-6H01-ds1-2",text:"②並列回路の電流・電圧の特徴",pts:10},
{id:"sci-6H01-ds1-3",text:"③豆電球の明るさ比較（直列・並列・乾電池の本数）",pts:10},{id:"sci-6H01-ds1-4",text:"④電流計のつなぎ方・使い方",pts:10},
{id:"sci-6H01-ds1-5",text:"⑤電磁石を強くする方法",pts:10},{id:"sci-6H01-ds1-6",text:"⑥コンデンサーの特徴",pts:10},
{id:"sci-6H01-ds1-7",text:"⑦光電池の特徴",pts:10},{id:"sci-6H01-ds1-8",text:"⑧モーターと発電機のしくみの違い",pts:10},
{id:"sci-6H01-ds1-9",text:"⑨電熱線の太さ・長さと電流の流れやすさ",pts:10},{id:"sci-6H01-ds1-10",text:"⑩乾電池の直列・並列つなぎと豆電球の明るさ・持ち",pts:10},
]},
],initialAnswers:{}},
{id:"sci-6H02",code:"6H-02",title:"太陽（春期）",isSpring:true,
sections:[
{id:"sci-6H02-k1",label:"確認問題①（季節による太陽の高さと通り道・地球の位置）",diff:1,cat:"確認問題",problems:[
{id:"sci-6H02-k1-1",text:"(1)図1のA〜Cは図2のどの位置の地球から見たものか→ア〜ウからそれぞれ選ぶ",pts:20},
{id:"sci-6H02-k1-2",text:"(2)図2で春分の日の頃の地球はどれか→ア〜エから選ぶ",pts:20},
{id:"sci-6H02-k1-3",text:"(3)地球が図2のようにア→イ→ウ→エ→アと太陽のまわりを回ることを何というか",pts:20},
{id:"sci-6H02-k1-4",text:"(4)太陽は少しも動かないのになぜ図1のように高さが変わるのか→理由を簡単に説明",pts:20},
{id:"sci-6H02-k1-5",text:"(5)図3で冬至の日の日の入りの様子はどれか→ア〜ケから選ぶ",pts:20},
]},
{id:"sci-6H02-k2",label:"確認問題②（天球図・棒の影の先端・A〜Cの通り道）",diff:1,cat:"確認問題",problems:[
{id:"sci-6H02-k2-1",text:"[I](1)図1のア〜エの方位をそれぞれ答えなさい",pts:10},
{id:"sci-6H02-k2-2",text:"[I](2)太陽の動く方向は①・②のどちらか→番号で答えなさい",pts:10},
{id:"sci-6H02-k2-3",text:"[I](3)太陽が真東から出て真西に沈む日の太陽の動きをA〜Cから1つ選ぶ",pts:10},
{id:"sci-6H02-k2-4",text:"[I](4)太陽の南中高度が最も高い日をA〜Cから1つ選ぶ",pts:10},
{id:"sci-6H02-k2-5",text:"[I](5)A〜Cのように太陽が動く日を春分・夏至・冬至の日からそれぞれ答えなさい",pts:10},
{id:"sci-6H02-k2-6",text:"[II](6)図2のア〜エの方位をそれぞれ答えなさい",pts:10},
{id:"sci-6H02-k2-7",text:"[II](7)影の先端が動く方向は①・②のどちらか→番号で答えなさい",pts:10},
{id:"sci-6H02-k2-8",text:"[II](8)太陽の南中高度が最も高い日の影の動きをD〜Fから1つ選ぶ",pts:10},
{id:"sci-6H02-k2-9",text:"[II](9)D〜Fのように影の先端が動く日を春分・夏至・冬至からそれぞれ答えなさい",pts:10},
{id:"sci-6H02-k2-10",text:"[II](10)Eのように影の先端の動きが一直線になる日の日の出と日の入りの方角をそれぞれ答えなさい",pts:10},
]},
{id:"sci-6H02-k3",label:"確認問題③（南中高度・南中時刻・日の出入りの時刻計算）",diff:1,cat:"確認問題",problems:[
{id:"sci-6H02-k3-1",text:"(1)表のあ月に入る数字をア〜エから選ぶ（3・6・9・12）",pts:20},
{id:"sci-6H02-k3-2",text:"(2)②〜⑥に当てはまる「昼の長さ」や「時刻」を答えなさい",pts:10},
{id:"sci-6H02-k3-3",text:"(3)A〜C地点の緯度と経度をア〜ウからそれぞれ選ぶ",pts:10},
{id:"sci-6H02-k3-4",text:"(4)A地点での3月21日（春分の日）の太陽の南中高度を答えなさい",pts:20},
{id:"sci-6H02-k3-5",text:"(5)神戸（東経135.2度・北緯34.7度）で3月21日の太陽の南中時刻が12時7分であったとき、A地点での南中時刻を答えなさい",pts:20},
{id:"sci-6H02-k3-6",text:"(6)次の表はい月20〜22日の神戸での日の出・日の入りの時刻→い月に入る数字を答えなさい",pts:20},
]},
{id:"sci-6H02-k4",label:"確認問題④（棒の影の先端の動き・台形状観測機器）",diff:1,cat:"確認問題",problems:[
{id:"sci-6H02-k4-1",text:"(1)図1の装置の名前を漢字で答えなさい（百葉箱）",pts:10},
{id:"sci-6H02-k4-2",text:"(2)①長さ100cmの棒を立てた日の棒の影の長さが100cmになるときの太陽高度",pts:10},
{id:"sci-6H02-k4-3",text:"(2)②①の太陽高度が含まれる時間帯としてふさわしいものをア〜エから選ぶ",pts:10},
{id:"sci-6H02-k4-4",text:"(3)①表2の□に当てはまる時刻を24時間制で答えなさい（日の入り時刻）",pts:10},
{id:"sci-6H02-k4-5",text:"(3)②図3の地球の公転の様子→表1・2を作成した日の地球の位置としてふさわしいものをア〜エから選ぶ",pts:10},
{id:"sci-6H02-k4-6",text:"(3)③表1・2を作成した日の地点Aと地点Bの太陽について最もふさわしいものをア〜エから1つ選ぶ",pts:10},
{id:"sci-6H02-k4-7",text:"(4)表1の観測結果を記録した日における、地点Aの太陽の南中時刻は何時何分か",pts:10},
{id:"sci-6H02-k4-8",text:"(5)表1において18時の太陽高度が書かれていないのはなぜか→簡単に説明",pts:10},
{id:"sci-6H02-k4-9",text:"(6)①表3の測定を15時に行った場合棒の影の長さとして最も近い数値をア〜エから選ぶ",pts:10},
{id:"sci-6H02-k4-10",text:"(6)②表3の測定を行った日の日かげ曲線と棒の影の先端部の動きとして最もふさわしいものをア〜エから選ぶ",pts:10},
]},
{id:"sci-6H02-k5",label:"確認問題⑤（各地の日の出・南中・日の入り・昼の長さの表）",diff:1,cat:"確認問題",problems:[
{id:"sci-6H02-k5-1",text:"(1)表のあ月に入る数字をア〜エから選ぶ",pts:20},
{id:"sci-6H02-k5-2",text:"(2)①〜⑥に当てはまる「昼の長さ」や「時刻」を答えなさい",pts:10},
{id:"sci-6H02-k5-3",text:"(3)A〜C地点の緯度と経度を選ぶ",pts:10},
{id:"sci-6H02-k5-4",text:"(4)A地点での3月21日の太陽の南中高度を答えなさい",pts:20},
{id:"sci-6H02-k5-5",text:"(5)神戸での3月21日の太陽の南中時刻が12時7分のときA地点での南中時刻を答えなさい",pts:20},
{id:"sci-6H02-k5-6",text:"(6)次の表はい月20〜22日の神戸での日の出・日の入りの時刻→い月の数字を答えなさい",pts:20},
]},
{id:"sci-6H02-k6",label:"確認問題⑥（日本5都市の表・季節特定）",diff:2,cat:"確認問題",problems:[
{id:"sci-6H02-k6-1",text:"(1)この日1日中太陽が昇らない地域の緯度は北緯何度以上か",pts:10},
{id:"sci-6H02-k6-2",text:"(2)この日の北半球で同じ経度の2つの地点を比べると日の出の時刻が早いのはどちら（ア〜ウ）",pts:10},
{id:"sci-6H02-k6-3",text:"(3)表の時刻を調べたのはいつごろか（1月・4月・7月・10月）",pts:10},
{id:"sci-6H02-k6-4",text:"(4)表の(a)と(b)に当てはまる時間や時刻を求めなさい",pts:10},
{id:"sci-6H02-k6-5",text:"(5)表でもっとも緯度が高いのはどの地点か→A〜Eの記号で答えなさい",pts:10},
{id:"sci-6H02-k6-6",text:"(6)表で同じ緯度にあるのはどれとどれか→A〜Eの記号で答えなさい",pts:10},
{id:"sci-6H02-k6-7",text:"(7)地点A〜Eはそれぞれ図2の①〜⑤のどこか",pts:20},
{id:"sci-6H02-k6-8",text:"(8)図2の③と④の経度の差は何度か",pts:10},
]},
{id:"sci-6H02-k7",label:"確認問題⑦（棒の影・地図上の5都市の春夏冬の計測データ）",diff:2,cat:"確認問題",problems:[
{id:"sci-6H02-k7-1",text:"(1)①図1のQに入る方角を漢字1字で答えなさい",pts:10},
{id:"sci-6H02-k7-2",text:"(1)②夏至の影の先端の動きとして最もふさわしいものをア〜カから1つ選ぶ",pts:10},
{id:"sci-6H02-k7-3",text:"(2)図2の地図の①〜⑤の地点で春分・夏至・冬至のいずれかの日に計測した→地球の位置をア〜エから選ぶ",pts:10},
{id:"sci-6H02-k7-4",text:"(3)X・Yに当てはまる昼の長さや南中時刻を求めなさい",pts:10},
{id:"sci-6H02-k7-5",text:"(4)A地点の緯度は北緯何度か（地球の公転軸に垂直な線に対して地軸の傾きは23.4度）",pts:10},
{id:"sci-6H02-k7-6",text:"(5)表1を計測した日についての説明として正しいものをア〜カから3つ選ぶ",pts:10},
{id:"sci-6H02-k7-7",text:"(6)図2の①・②・③地点での計測結果として当てはまるものを表1のA〜Eからそれぞれ1つ選ぶ",pts:10},
]},
{id:"sci-6H02-k8",label:"確認問題⑧（太陽の高さと時刻のグラフ・明石）",diff:2,cat:"確認問題",problems:[
{id:"sci-6H02-k8-1",text:"(1)ある日とはいつごろのことか→ア〜エから選ぶ（春分・夏至・秋分・冬至）",pts:20},
{id:"sci-6H02-k8-2",text:"(2)同じ日に明石の真南にある場所で観測するとどのようなグラフになるか→図2のア〜シから選ぶ",pts:40},
{id:"sci-6H02-k8-3",text:"(3)同じ日に明石の真東にある場所で観測するとどのようなグラフになるか→図2のア〜シから選ぶ",pts:40},
]},
{id:"sci-6H02-k9",label:"確認問題⑨（日の出の時刻が1年を通してどのように変化するか・4都市のグラフ）",diff:2,cat:"確認問題",problems:[
{id:"sci-6H02-k9-1",text:"(1)図2のA〜D地点における日の出の時刻のグラフを図1のア〜エからそれぞれ選びなさい",pts:20},
{id:"sci-6H02-k9-2",text:"(2)図3は図1のイのグラフの地点における日の入りの時刻が1年を通してどのように変化するかを調べてグラフにしたもの→図1のアのグラフの地点において日の入りの時刻が1年を通してどのように変化するかを解答らんの図にグラフをかきなさい",pts:40},
{id:"sci-6H02-k9-3",text:"(3)図4は図1のウのグラフの地点における日の入りの時刻→図1のエのグラフの地点において日の入りの時刻のグラフをかきなさい",pts:40},
]},
{id:"sci-6H02-k10",label:"確認問題⑩（地球に太陽光が当たっている様子・北極点付近の緯度）",diff:2,cat:"確認問題",problems:[
{id:"sci-6H02-k10-1",text:"(1)この日1日中太陽が昇らない地域の緯度は北緯何度以上か",pts:10},

{id:"social-640-04-kiso1",label:"確認問題 基礎編[1]（年表・A〜Eの時代名・年代と[1]〜[12]語句・下線部❶〜❾の設問）",diff:1,cat:"確認問題 基礎編",problems:[
{id:"social-640-04-k1-1",text:"(1)A・B時代名を答えなさい、C〜E年代を答えなさい",pts:2},
{id:"social-640-04-k1-2",text:"(2)[1]〜[12]に当てはまる語句・人物名を答えなさい",pts:2},
{id:"social-640-04-k1-3",text:"(3)下線部❶（織田信長）が行った政治の説明→空らん①②に当てはまる語句",pts:5},
{id:"social-640-04-k1-4",text:"(4)下線部❷（豊臣秀吉）について朝廷から任命された地位をA〜Eから選ぶ",pts:2},
{id:"social-640-04-k1-5",text:"(5)下線部❸（太閤検地）の①〜④の文の正誤（○×）",pts:5},
{id:"social-640-04-k1-6",text:"(6)下線部❹（刀狩）の目的と影響を簡単に説明",pts:5},
{id:"social-640-04-k1-7",text:"(7)下線部❺（参勤交代）を定めた法律名",pts:2},
{id:"social-640-04-k1-8",text:"(8)下線部❻（参勤交代）の結果として大名にどのような変化があったか",pts:2},
{id:"social-640-04-k1-9",text:"(9)下線部❼（享保の改革）の①〜④の文の正誤（○×）",pts:2},
{id:"social-640-04-k1-10",text:"(10)①田沼意次 ②新井白石は年表中のあ〜えのどの出来事の直後に入るか",pts:2},
]},
{id:"social-640-04-kiso2",label:"確認問題 基礎編[2]（史料A〜F・絵を見て答える）",diff:1,cat:"確認問題 基礎編",problems:[
{id:"social-640-04-k2-1",text:"[1](1)A「ある命令」とは何か解答らんに合うように答えなさい",pts:2},
{id:"social-640-04-k2-2",text:"[1](1)②この命令を出した人物の名前を漢字で",pts:2},
{id:"social-640-04-k2-3",text:"[1](1)③この命令を出した人物について正しく説明しているものに○・まちがっているものに×（ア〜エ）",pts:2},
{id:"social-640-04-k2-4",text:"[1](2)B「ある宗教」の取りしまりの様子→その宗教とは何か",pts:2},
{id:"social-640-04-k2-5",text:"[1](3)C「ある制度」についての命令→その制度を漢字で",pts:2},
{id:"social-640-04-k2-6",text:"[1](4)D「あるきまり」の一部→そのきまりとは何か",pts:2},
{id:"social-640-04-k2-7",text:"[1](5)B〜Dは「ある人物」のときに始められたりした→その人物の名前を漢字で",pts:2},
{id:"social-640-04-k2-8",text:"[1](6)E：18世紀の前半に政治改革を行い成果を上げた→その改革を何というか",pts:2},
{id:"social-640-04-k2-9",text:"[1](7)F：19世紀の前半に反乱を起こした→反乱を起こした場所を現在の都市名で",pts:2},
{id:"social-640-04-k2-9b",text:"[2](1)A〜Fに当てはまる人物の名前を漢字で答えなさい（各2点×6）",pts:2},
{id:"social-640-04-k2-10",text:"[2](2)空らん(1)〜(6)に当てはまる語句（各2点）",pts:2},
{id:"social-640-04-k2-11",text:"[2](3)空らん[あ]の数字をア〜エから選ぶ（100・200・300・400）",pts:2},
{id:"social-640-04-k2-12",text:"[2](4)①〜⑫の文に当てはまる人物をA〜Fから選ぶ（×は該当なし・各3点×12）",pts:3},
{id:"social-640-04-k2-13",text:"[2](5)A〜Fの人物を活躍した時期の古い順に並べる",pts:2},
]},
{id:"social-640-04-hatten1",label:"確認問題 発展編[1]（天下人3人の史料カード・I=信長 II=秀吉 III=家康）",diff:2,cat:"確認問題 発展編",problems:[
{id:"social-640-04-h1-1",text:"(1)(ア)〜(ウ)に当てはまる人名・地名を答えなさい",pts:3},
{id:"social-640-04-h1-2",text:"(2)下線部aについてまちがっている説明をA〜Eから選ぶ",pts:3},
{id:"social-640-04-h1-3",text:"(3)下線部bについてふさわしくない文を選ぶ（太閤検地の説明）",pts:3},
{id:"social-640-04-h1-4a",text:"(4)①身分制度の命令名を答えなさい",pts:3},
{id:"social-640-04-h1-4b",text:"(4)②まちがっている説明をA〜Eから選ぶ（身分制度）",pts:3},
{id:"social-640-04-h1-4c",text:"(4)③大名に幕府の都市と領地を1年ごとに行き来させるきまりの名前",pts:3},
{id:"social-640-04-h1-5",text:"(5)[A]に当てはまる文をア〜ウから選ぶ",pts:3},
{id:"social-640-04-h1-6",text:"(6)I〜IIIの人物の名前を漢字で答えなさい（各3点×3）",pts:3},
]},
{id:"social-640-04-hatten2",label:"確認問題 発展編[2]（6人A〜Fの自己紹介文・江戸時代の政治家）",diff:2,cat:"確認問題 発展編",problems:[
{id:"social-640-04-h2-1",text:"(1)A〜Fの人物の名前を漢字で答えなさい（各2点×6）",pts:2},
{id:"social-640-04-h2-2",text:"(2)空らん(1)〜(6)に当てはまる語句（各2点）",pts:2},
{id:"social-640-04-h2-3",text:"(3)空らん[あ]の数字をア〜エから選ぶ（100・200・300・400）",pts:2},
{id:"social-640-04-h2-4",text:"(4)①〜⑫の文に当てはまる人物をA〜Fから選ぶ（×は該当なし・各3点×12）",pts:3},
{id:"social-640-04-h2-5",text:"(5)A〜Fの人物をかつやくした時期の古い順に並べる",pts:2},
]},
{id:"social-640-04-jissen",label:"確認問題 実践編（江戸時代を批判した狂歌・川柳A〜D）",diff:3,cat:"確認問題 実践編",problems:[
{id:"social-640-04-j1-1",text:"(1)A①「古池や〜」の俳句を詠んだ人物を漢字で答えなさい",pts:2},
{id:"social-640-04-j1-2",text:"(1)A②Aの川柳で批判された政治が開始される直前にきんきんに苦しむ人びとを救うため反乱を起こした人物を漢字で",pts:2},
{id:"social-640-04-j1-3",text:"(1)A③Aの川柳で批判された政治では異国船打払令をゆるめ燃料や水を与えることを認めた→方針転換のきっかけとなった戦争の名前",pts:2},
{id:"social-640-04-j1-4",text:"(1)A④Aの川柳で批判された政治で幕府は「ある命令」を出したが大名や旗本らの反発を受け失敗→「ある命令」とは何か史料を参考に30字以内で説明",pts:4},
{id:"social-640-04-j2-1",text:"(2)B①「白河」とは人物を表している→その人物の名前を漢字で",pts:2},
{id:"social-640-04-j2-2",text:"(2)B②①の人物は幕府の公式な学問所では朱子学以外の学問を教えることを禁止した→その理由として最もふさわしいものをア〜エから1つ",pts:2},
{id:"social-640-04-j2-3",text:"(2)B③Bの狂歌で批判された政治はA〜Dを実施された順に並べると何番目か算用数字で",pts:2},
{id:"social-640-04-j3-1",text:"(3)C①この制度（上知令）を何というか解答らんに合うように答えなさい",pts:2},
{id:"social-640-04-j3-2",text:"(3)C②Cの狂歌で批判された政治を行った人物の出身地を表した地図としてふさわしいものをア〜エから1つ",pts:2},
{id:"social-640-04-j3-3",text:"(3)C③Cの狂歌で批判された政治を説明したI・IIの文の正誤の組み合わせとして最もふさわしいものをア〜エから1つ",pts:2},
{id:"social-640-04-j4-1",text:"(4)D①Dの川柳で批判された政治について説明した文として最もふさわしくないものをア〜エから1つ",pts:2},
{id:"social-640-04-j4-2",text:"(4)D②Dの川柳で批判された政治が行われたころ「●●のきんきん」が発生し同時期に浅間山が噴火した→●●に当てはまる元号を漢字2字で",pts:2},
]},

// ============================================================
// データ定義：科目・回・問題

// ============================================================
// ストレージ抽象化レイヤー（永続化保証版）
// 優先順位: window.storage → localStorage → IndexedDB
// ユーザーデータを絶対にリセットしない
// ============================================================
const Storage = (() => {
  // ── 1. window.storage（Claude artifact API）──
  const ws = {
    available: () => {
      try {
        return typeof window !== 'undefined' &&
          window.storage != null &&
          typeof window.storage.get === 'function' &&
          typeof window.storage.set === 'function';
      } catch { return false; }
    },
    get: async (key) => { try { return await window.storage.get(key, true); } catch { return null; } },
    set: async (key, value) => { try { return await window.storage.set(key, value, true); } catch { return null; } },
    delete: async (key) => { try { return await window.storage.delete(key, true); } catch { return null; } },
    list: async (prefix) => { try { return await window.storage.list(prefix, true); } catch { return { keys: [] }; } },
  };

  // ── 2. localStorage ──
  const ls = {
    available: () => { try { localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return true; } catch { return false; } },
    get: async (key) => { try { const v = localStorage.getItem(key); return v != null ? { key, value: v } : null; } catch { return null; } },
    set: async (key, value) => { try { localStorage.setItem(key, value); return { key, value }; } catch { return null; } },
    delete: async (key) => { try { localStorage.removeItem(key); return { key, deleted: true }; } catch { return null; } },
    list: async (prefix = '') => {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(prefix)) keys.push(k);
        }
        return { keys };
      } catch { return { keys: [] }; }
    },
  };

  // ── 3. IndexedDB（最終フォールバック）──
  const idb = (() => {
    const DB = 'sapix_db', STORE = 'kv';
    let _db = null;
    const open = () => new Promise((res, rej) => {
      if (_db) { res(_db); return; }
      const r = indexedDB.open(DB, 1);
      r.onupgradeneeded = e => e.target.result.createObjectStore(STORE);
      r.onsuccess = e => { _db = e.target.result; res(_db); };
      r.onerror = () => rej(r.error);
    });
    const tx = async (mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction(STORE, mode);
        const s = t.objectStore(STORE);
        const r = fn(s);
        if (r) { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
        else { t.oncomplete = () => res(); t.onerror = () => rej(t.error); }
      });
    };
    return {
      available: () => typeof indexedDB !== 'undefined',
      get: async (key) => { try { const v = await tx('readonly', s => s.get(key)); return v != null ? { key, value: v } : null; } catch { return null; } },
      set: async (key, value) => { try { await tx('readwrite', s => s.put(value, key)); return { key, value }; } catch { return null; } },
      delete: async (key) => { try { await tx('readwrite', s => s.delete(key)); return { key, deleted: true }; } catch { return null; } },
      list: async (prefix = '') => {
        try {
          const keys = await tx('readonly', s => s.getAllKeys());
          return { keys: (keys || []).filter(k => typeof k === 'string' && k.startsWith(prefix)) };
        } catch { return { keys: [] }; }
      },
    };
  })();

  // 利用可能なストレージを選択（複数に同時書き込みして確実に保存）
  const getBackends = () => {
    const backends = [];
    if (ws.available()) backends.push(ws);
    if (ls.available()) backends.push(ls);
    if (idb.available()) backends.push(idb);
    return backends.length > 0 ? backends : [idb]; // 最低限idb
  };

  return {
    get: async (key) => {
      // 全バックエンドから順に試して最初に見つかった値を返す
      for (const b of getBackends()) {
        const r = await b.get(key);
        if (r != null) return r;
      }
      return null;
    },
    set: async (key, value) => {
      // 全バックエンドに並行書き込み（冗長保存）
      const backends = getBackends();
      const results = await Promise.allSettled(backends.map(b => b.set(key, value)));
      const success = results.find(r => r.status === 'fulfilled' && r.value != null);
      return success ? success.value : null;
    },
    delete: async (key) => {
      const backends = getBackends();
      await Promise.allSettled(backends.map(b => b.delete(key)));
      return { key, deleted: true };
    },
    list: async (prefix = '') => {
      for (const b of getBackends()) {
        const r = await b.list(prefix);
        if (r && r.keys && r.keys.length > 0) return r;
      }
      // 全バックエンドを集約
      const allKeys = new Set();
      for (const b of getBackends()) {
        const r = await b.list(prefix);
        if (r && r.keys) r.keys.forEach(k => allKeys.add(k));
      }
      return { keys: [...allKeys] };
    },
  };
})();

// 単元データ整合性チェック＆自動修復
// 起動時・UNITS変更時に実行して常に安全な状態を保つ

function sanitizeUnit(unit) {
  if (!unit || typeof unit !== 'object') return null;
  // sections が配列でない場合は空配列に
  if (!Array.isArray(unit.sections)) unit.sections = [];
  // 各sectionのproblemsが配列でない場合は空配列に
  unit.sections = unit.sections.map(sec => {
    if (!sec || typeof sec !== 'object') return null;
    if (!Array.isArray(sec.problems)) sec.problems = [];
    // 必須フィールドの保証
    return {
      id: sec.id || `sec-${Math.random().toString(36).slice(2,7)}`,
      label: sec.label || '問題',
      diff: sec.diff || 2,
      cat: sec.cat || '問題',
      problems: sec.problems.filter(p => p && p.id).map(p => ({
        id: p.id,
        text: p.text || '',
        pts: typeof p.pts === 'number' ? p.pts : 5,
      })),
    };
  }).filter(Boolean);
  return unit;
}

function sanitizeAllUnits(units) {
  const result = {};
  for (const [subjId, arr] of Object.entries(units)) {
    if (!Array.isArray(arr)) { result[subjId] = []; continue; }
    result[subjId] = arr.map(sanitizeUnit).filter(Boolean);
  }
  return result;
}

function calcStats(sections, answers) {
// sections/problems が null/undefined でも安全に動作する
if (!sections || !Array.isArray(sections)) return { correct:0, answered:0, total:0, pct:null };
let correct = 0, answered = 0, total = 0;
sections.forEach(s => {
if (!s || !Array.isArray(s.problems)) return;
s.problems.forEach(p => {
total++;
const a = answers[p.id];
if (a !== null && a !== undefined) { answered++; if (a === true) correct++; }
});
});
return { correct, answered, total, pct: answered === 0 ? null : Math.round(correct / answered * 100) };
}

function pctColor(pct) {
if (pct === null) return "#94a3b8";
if (pct >= 80) return "#22c55e";
if (pct >= 60) return "#f59e0b";
return "#ef4444";
}

function MiniRing({ pct, size = 44, stroke = 5 }) {

const circ = 2 * Math.PI * r;
const fill = (pct ?? 0) / 100 * circ;

return (
<svg width={size} height={size} style={{ transform: "rotate(-90deg)", flexShrink: 0 }}>
<circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#e2e8f0" strokeWidth={stroke} />

function Dashboard({ allAnswers, onSelectUnit, onGoHome }) {
const [dashTab, setDashTab] = useState("progress"); // "progress" | "prints"
const [uploadedPdfs, setUploadedPdfs] = useState({}); // {unitId: {name, dataUrl, size}}
const [uploading, setUploading] = useState(false);
const [uploadMsg, setUploadMsg] = useState("");
const [showMapModal, setShowMapModal] = useState(false);
const [pendingFile, setPendingFile] = useState(null); // {name, dataUrl, size, guessedId, guessedSubjId}
const [customUnits, setCustomUnits] = useState({}); // {unitId: {id,title,code,subjId,isCustom}}
const [showNewUnit, setShowNewUnit] = useState(false); // 新規単元作成フォーム表示
const [newUnitTitle, setNewUnitTitle] = useState("");
const [newUnitSubjId, setNewUnitSubjId] = useState("math");
const [showManualSetup, setShowManualSetup] = useState(null); // 手動設定 {unitId,code,subjId,title}
const [manualSections, setManualSections] = useState(1); // 大問数
const [manualProbs, setManualProbs] = useState(4); // 1大問あたりの小問数
const [reAnalyzingId, setReAnalyzingId] = useState(null); // 再解析中の単元ID

// ストレージからアップロード済みPDFの一覧を読み込み
useEffect(()=>{
(async()=>{
try {
const result = await Storage.list("pdf_upload_");
if(result && result.keys) {
const map = {};
for(const key of result.keys) {
try {
const r = await Storage.get(key);
if(r) {
const data = JSON.parse(r.value);
const unitId = key.replace("pdf_upload_","");
map[unitId] = data;
}
} catch {}
}
setUploadedPdfs(map);
}
} catch {}
// カスタム単元の読み込み
try {
const r = await Storage.get("custom_units");
if(r) {
const loaded = JSON.parse(r.value);
// カスタム単元も整合性チェック
const sanitized = {};
for(const [uid, u] of Object.entries(loaded)) {
sanitized[uid] = sanitizeUnit({...u}) || u;
}
setCustomUnits(sanitized);
}
} catch {}
})();
},[]);

// ファイル名から科目IDを推測

return "math";

// 算数
if(/算601|60-01|数の性質/.test(n)) return "math-61-01";
if(/算602|60-02|平面図形/.test(n)&&!/H/.test(n)) return "math-61-02";
if(/算603|60-03|割合/.test(n)&&!/H/.test(n)) return "math-61-03";
if(/算604|60-04/.test(n)&&!/H/.test(n)) return "math-61-04";
if(/算605|60-05|速さ/.test(n)&&!/H/.test(n)) return "math-61-05";
if(/算606|60-06/.test(n)&&!/H/.test(n)) return "math-61-06";
if(/算607|60-07|二量/.test(n)) return "math-61-07";
if(/算608|60-08|小数分数/.test(n)) return "math-61-08";
if(/算609|61-09|立体図形/.test(n)) return "math-61-09";
if(/算6H01|H.*割合/.test(n)) return "math-H61-01";
if(/算6H02|H.*平面/.test(n)) return "math-H61-02";
if(/算6H03|H.*立体/.test(n)) return "math-H61-03";
if(/算6H04|H.*グラフ|H.*ク_ラフ/.test(n)) return "math-H61-04";
if(/算6H05|H.*規則/.test(n)) return "math-H61-05";
if(/算6H06|H.*場合/.test(n)) return "math-H61-06";
// 国語
if(/国601|62A-01/.test(n)) return "japanese-62A-01";
if(/国602|62A-02/.test(n)) return "japanese-62A-02";
if(/国603|62A-03/.test(n)) return "japanese-62A-03";
if(/国604|62A-04/.test(n)) return "japanese-62A-04";
if(/国605|62A-05/.test(n)) return "japanese-62A-05";
if(/国606|62A-06/.test(n)) return "japanese-62A-06";
if(/国607|62A-07/.test(n)) return "japanese-62A-07";
if(/国608|62A-08/.test(n)) return "japanese-62A-08";
if(/国609|62A-09/.test(n)) return "japanese-62A-09";
// 理科
if(/理601|水溶液/.test(n)) return "sci-601";
if(/理602|植物/.test(n)&&!/理603/.test(n)) return "sci-602";
if(/理603/.test(n)) return "sci-603";
if(/理604|光①|光.1/.test(n)) return "sci-604";
if(/理605|光②|光.2/.test(n)) return "sci-605";
if(/理606|燃焼/.test(n)) return "sci-606";
if(/理607|太陽と月/.test(n)) return "sci-607";
if(/理608|人体/.test(n)) return "sci-608";
if(/理609|てこ/.test(n)) return "sci-609";
if(/理6H01|H.*電気/.test(n)) return "sci-H61-01";
if(/理6H02|H.*太陽/.test(n)) return "sci-H61-02";
if(/理6H03|H.*月/.test(n)) return "sci-H61-03";
// 社会
if(/社601|旧石器/.test(n)) return "social-640-01";
if(/社602|古墳.*平安/.test(n)) return "social-640-02";
if(/社603|平安.*室町/.test(n)) return "social-640-03";
if(/社604|戦国.*江戸/.test(n)) return "social-640-04";
if(/社605|江戸.*明治/.test(n)) return "social-640-05";
if(/社606|明治.*昭和/.test(n)) return "social-640-06";
if(/社607|文化史/.test(n)) return "social-640-07";
if(/社608|外交史/.test(n)) return "social-640-08";
if(/社609/.test(n)) return "social-640-09";

if(/社6H02|産業史.*1|産業史①/.test(n)) return "social-6H02";
if(/社6H03|産業史.*2|産業史②/.test(n)) return "social-6H03";
return null;
};

// ファイル選択ハンドラ
const handleFileSelect = (e) => {
const file = e.target.files[0];
if(!file) return;
if(!file.name.toLowerCase().endsWith('.pdf')) {
setUploadMsg("PDFファイルを選択してください"); return;
}
if(file.size > 50*1024*1024) {
setUploadMsg("ファイルサイズが50MBを超えています"); return;
}
setUploading(true);
setUploadMsg("読み込み中…");
const reader = new FileReader();
reader.onload = (ev) => {
const dataUrl = ev.target.result;
const guessedId = guessUnitId(file.name);
const guessedSubjId = guessSubjId(file.name);
setPendingFile({ name: file.name, dataUrl, size: file.size, guessedId, guessedSubjId });
setNewUnitSubjId(guessedSubjId);
setNewUnitTitle(file.name.replace(/\.pdf$/i,""));
setShowMapModal(true);
setUploading(false);
setUploadMsg("");
};
reader.onerror = () => { setUploading(false); setUploadMsg("読み込みに失敗しました"); };
reader.readAsDataURL(file);
e.target.value = "";
};

// PDFを保存
const savePdf = async (unitId) => {
if(!pendingFile || !unitId) return;
setUploading(true);
try {
const data = { name: pendingFile.name, dataUrl: pendingFile.dataUrl, size: pendingFile.size, savedAt: new Date().toISOString() };
await Storage.set(`pdf_upload_${unitId}`, JSON.stringify(data));
setUploadedPdfs(prev => ({...prev, [unitId]: data}));
setShowMapModal(false);
setShowNewUnit(false);
setPendingFile(null);
setUploadMsg(`✅ 保存しました`);
setTimeout(()=>setUploadMsg(""), 3000);
} catch(e) {
setUploadMsg("保存に失敗しました: " + e.message);
}
setUploading(false);
};

// 新規カスタム単元を作成してPDFを保存
const createAndSave = async () => {
if(!newUnitTitle.trim()) { setUploadMsg("単元名を入力してください"); return; }
if(!pendingFile) return;
const subjId = newUnitSubjId;
const existingCustom = Object.values(customUnits).filter(u=>u.subjId===subjId);
const num = existingCustom.length + 1;
const unitId = `custom-${subjId}-${Date.now()}`;
const subj = SUBJECTS.find(s=>s.id===subjId);
const code = `${subj?.label?.slice(0,1)||""}追加${String(num).padStart(2,"0")}`;

setUploading(true);
setUploadMsg("📖 PDFを解析中…");

// dataUrlからbase64とmedia_typeを取得
const dataUrl = pendingFile.dataUrl;
const mimeMatch = dataUrl.match(/^data:([^;]+);base64,/);
const mediaType = mimeMatch ? mimeMatch[1] : "application/pdf";
const base64Data = dataUrl.split(",")[1];

// PDF解析関数（リトライ付き）
const analyzePdf = async (attempt = 1) => {
const isRetry = attempt > 1;
if(isRetry) setUploadMsg(`🔄 再解析中…（${attempt}回目）`);

const prompt = attempt === 1
? `SAPIXのプリントPDFです。大問と小問の構成を読み取りJSONで返してください。

出力形式（JSONのみ・説明文不要）:
{"sections":[{"id":"s1","label":"大問1","diff":2,"cat":"確認問題","problems":[{"id":"s1-1","text":"(1)","pts":5},{"id":"s1-2","text":"(2)","pts":5}]}]}

ルール:
・大問ごとに1つのsectionを作る
・problemsのtextは問題番号（(1)(2)や①②など）
・diff:1=基本/2=標準/3=応用、pts:配点（不明なら5）
・idはs1,s1-1のような形式で必ずユニークにする
・JSONのみ返す`
: `このプリントの問題番号をすべて読み取ってください。
大問が何個あり、各大問に小問が何個あるか数えてJSONで返してください。

出力形式（JSONのみ）:
{"sections":[{"id":"s1","label":"大問1","diff":2,"cat":"問題","problems":[{"id":"s1-1","text":"(1)","pts":5}]}]}

JSONのみ返してください。`;

const resp = await fetch("https://api.anthropic.com/v1/messages", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
model: "claude-sonnet-4-20250514",
max_tokens: 2000,
messages: [{
role: "user",
content: [
{ type: "document", source: { type: "base64", media_type: mediaType, data: base64Data } },
{ type: "text", text: prompt }
]
}]
})
});

if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
const data = await resp.json();

if(data.error) throw new Error(data.error.message || "APIエラー");

const text = data.content?.[0]?.text || "";
if(!text) throw new Error("レスポンスが空");

// JSON部分を抽出
const jsonMatch = text.match(/\{[\s\S]*\}/);
if(!jsonMatch) throw new Error("JSONが見つからない");

const parsed = JSON.parse(jsonMatch[0]);
const sections = parsed.sections || [];
if(sections.length === 0) throw new Error("問題が読み取れなかった");

// IDの重複チェック・修正
const usedIds = new Set();
sections.forEach((sec, si) => {
if(!sec.id || usedIds.has(sec.id)) sec.id = `s${si+1}`;
usedIds.add(sec.id);
sec.problems?.forEach((p, pi) => {
const pid = `${sec.id}-${pi+1}`;
p.id = pid;
});
});

return sections;
};

let sections = null;
let errorMsg = "";

// 最大2回試行
for(let attempt = 1; attempt <= 2; attempt++) {
try {
sections = await analyzePdf(attempt);
break;
} catch(e) {
errorMsg = e.message;
if(attempt === 1) {
setUploadMsg(`⚠️ 1回目失敗（${e.message}）→ 再試行中…`);
await new Promise(r => setTimeout(r, 1000));
}
}
}

if(!sections) {
// 両方失敗 → 手動設定UIを表示
setUploading(false);
setUploadMsg(`❌ PDF解析失敗（${errorMsg}）\n下の「手動で問題数を設定」から設定してください`);
setShowManualSetup({ unitId, code, subjId, title: newUnitTitle.trim() });
return;
}

// 保存
const newUnit = { id: unitId, title: newUnitTitle.trim(), code, subjId, isCustom: true, sections };
const nextCustom = { ...customUnits, [unitId]: newUnit };
try {
await Storage.set("custom_units", JSON.stringify(nextCustom));
setCustomUnits(nextCustom);
await savePdf(unitId);
const totalProbs = sections.reduce((a,s)=>a+s.problems.length, 0);
setUploadMsg(`✅ 「${newUnitTitle}」を作成（${sections.length}大問・${totalProbs}問 読み取り完了）`);
setTimeout(()=>setUploadMsg(""), 5000);
} catch(e) {
setUploadMsg("保存に失敗しました: " + e.message);
}
setUploading(false);
};



// 手動設定で単元を保存
const saveManualUnit = async () => {
if(!showManualSetup || !pendingFile) return;
setUploading(true);
const { unitId, code, subjId, title } = showManualSetup;
const sections = Array.from({ length: manualSections }, (_, si) => ({
id: `s${si+1}`,
label: `大問${si+1}`,
diff: 2,
cat: "問題",
problems: Array.from({ length: manualProbs }, (_, pi) => ({
id: `s${si+1}-${pi+1}`,
text: `(${pi+1})`,
pts: 5,
}))
}));
const newUnit = { id: unitId, title, code, subjId, isCustom: true, sections };
const nextCustom = { ...customUnits, [unitId]: newUnit };
try {
await Storage.set("custom_units", JSON.stringify(nextCustom));
setCustomUnits(nextCustom);
await savePdf(unitId);
const total = sections.reduce((a,s)=>a+s.problems.length,0);
setUploadMsg(`✅ 「${title}」を作成（${manualSections}大問・${total}問）`);
setShowManualSetup(null);
setTimeout(()=>setUploadMsg(""), 4000);
} catch(e) {
setUploadMsg("保存に失敗: " + e.message);
}
setUploading(false);
};

// PDFを削除
const deletePdf = async (unitId) => {
try {
await Storage.delete(`pdf_upload_${unitId}`);
setUploadedPdfs(prev => { const n={...prev}; delete n[unitId]; return n; });
} catch {}
};

// PDFを新しいタブで開く
const openPdf = (unitId) => {
const pdf = uploadedPdfs[unitId];
if(!pdf) return;
const w = window.open("","_blank");
if(w) {
w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{margin:0;background:#1e293b;}iframe{width:100%;height:100vh;border:none;}</style></head><body><iframe src="${pdf.dataUrl}"></iframe></body></html>`);
w.document.close();
}
};

// カスタム単元のPDFを再解析して問題構成を更新
const reAnalyzePdf = async (unitId) => {
const pdf = uploadedPdfs[unitId];
const unit = customUnits[unitId];
if(!pdf || !unit) { setUploadMsg("PDFまたは単元情報が見つかりません"); return; }

setReAnalyzingId(unitId);
setUploadMsg(`📖 「${unit.title}」を再解析中…`);

const mimeMatch = pdf.dataUrl.match(/^data:([^;]+);base64,/);
const mediaType = mimeMatch ? mimeMatch[1] : "application/pdf";
const base64Data = pdf.dataUrl.split(",")[1];

// PDF解析（2回試行）
const analyze = async (attempt) => {
const prompt = attempt === 1
? `SAPIXのデイリーサポートプリントです。全ページの大問・小問の構成を読み取り、JSONで返してください。

出力形式（JSONのみ・説明文不要）:
{"sections":[{"id":"s1","label":"導入と基本①","diff":1,"cat":"分類","problems":[{"id":"s1-1","text":"[1](1)問題の内容を20字以内で","pts":5}]}]}

重要なルール:
・すべての大問をsectionとして含める（導入と基本・デイリーアプローチ・Daily Supportなど）
・各大問の小問を全てproblemsに含める
・textは問題内容を20字以内で（例：「[1](1)xとyの式を表せ」）
・diff:1=基本,2=標準,3=応用
・idは重複なしでs1,s1-1形式
・JSONのみ返す`
: `このプリントの問題番号を全て数えてJSONで返してください。大問と小問の構成のみ。

{"sections":[{"id":"s1","label":"大問1","diff":2,"cat":"問題","problems":[{"id":"s1-1","text":"(1)","pts":5}]}]}

JSONのみ。`;

const resp = await fetch("https://api.anthropic.com/v1/messages", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
model: "claude-sonnet-4-20250514",
max_tokens: 4000,
messages: [{
role: "user",
content: [
{ type: "document", source: { type: "base64", media_type: mediaType, data: base64Data } },
{ type: "text", text: prompt }
]
}]
})

if(!resp.ok) throw new Error(`HTTP ${resp.status}`);

if(data.error) throw new Error(data.error.message);

const parsed = JSON.parse(m[0]);
const sections = parsed.sections || [];
if(sections.length === 0) throw new Error("問題なし");

const used = new Set();
sections.forEach((sec, si) => {
if(!sec.id || used.has(sec.id)) sec.id = `s${si+1}`;
used.add(sec.id);
(sec.problems||[]).forEach((p, pi) => { p.id = `${sec.id}-${pi+1}`; });
});
return sections;
};

break;

setUploadMsg(`⚠️ 1回目失敗→再試行中…`);
await new Promise(r=>setTimeout(r,1000));
}
}

borderTop: ui > 0 ? "1px solid #0f172a" : "1px solid #0f172a",
background:"#1e293b",
transition:"background 0.15s",
}}
onMouseEnter={e => e.currentTarget.style.background="#263347"}
onMouseLeave={e => e.currentTarget.style.background="#1e293b"}
>
<div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:4 }}>
{unit.isSpring && (
<span style={{ fontSize:9, background:"#7c3aed", color:"white", padding:"1px 5px", borderRadius:4, fontFamily:"'Noto Sans JP',sans-serif", flexShrink:0 }}>春</span>
)}
<span style={{ fontSize:10, color:"#64748b", fontFamily:"monospace", flexShrink:0 }}>{unit.code}</span>
{hasPdf && <span style={{ fontSize:9, color:"#4ade80", flexShrink:0 }}>📄</span>}
</div>
<div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:5 }}>
<div style={{ fontSize:11, fontWeight:700, color:"#e2e8f0", fontFamily:"'Noto Serif JP',serif", lineHeight:1.3, flex:1, cursor:"pointer" }}
onClick={() => onSelectUnit(subj, unit)}>
{unit.title}
</div>
{/* プリントアップロードボタン */}
<label style={{ padding:"3px 7px", borderRadius:6, border: hasPdf?"1px solid rgba(34,197,94,.4)":"1px dashed rgba(59,130,246,.4)", background:"transparent", color: hasPdf?"#4ade80":"#60a5fa", fontSize:9, cursor:"pointer", flexShrink:0, whiteSpace:"nowrap" }}
onClick={e=>e.stopPropagation()}>
<input type="file" accept=".pdf" style={{ display:"none" }} onChange={(e)=>{
const file = e.target.files[0];
if(!file) return;
if(file.size > 50*1024*1024) { setUploadMsg("ファイルサイズが50MBを超えています"); return; }
setUploading(true);
const reader = new FileReader();
reader.onload = async (ev) => {
const data = { name: file.name, dataUrl: ev.target.result, size: file.size, savedAt: new Date().toISOString() };
try {
await Storage.set(`pdf_upload_${unit.id}`, JSON.stringify(data));
setUploadedPdfs(prev=>({...prev,[unit.id]:data}));
setUploadMsg(`✅ ${unit.code} 保存しました`);
setTimeout(()=>setUploadMsg(""),3000);
} catch(err) { setUploadMsg("保存失敗: "+err.message); }
setUploading(false);
e.target.value = "";
};
reader.readAsDataURL(file);
}} />
{hasPdf ? "📤 更新" : "📤"}
</label>
</div>
<div style={{ display:"flex", alignItems:"center", gap:6, cursor:"pointer" }}
onClick={() => onSelectUnit(subj, unit)}>
<div style={{ flex:1, height:3, background:"#0f172a", borderRadius:2, overflow:"hidden" }}>
<div style={{ height:"100%", width:`${progress*100}%`, background: s.pct===null?"#334155":col, borderRadius:2, transition:"width 0.5s ease" }} />
</div>
<span style={{ fontSize:11, fontWeight:800, color:col, fontFamily:"monospace", minWidth:30, textAlign:"right" }}>
{s.pct !== null ? `${s.pct}%` : s.answered > 0 ? `${s.answered}` : "—"}
</span>
</div>
</div>
);
})
)}
</div>
</div>
);
})}
</div>
)}
</div>
);
}

// WS正誤の集計
function calcWsStats(sections, answers) {
if (!sections || !Array.isArray(sections)) return {correct:0,answered:0,total:0};
let correct=0,answered=0,total=0;
sections.forEach(s=>{
  if (!s || !Array.isArray(s.problems)) return;
  s.problems.forEach(p=>{
    total++;
    const a=answers[p.id];
    if(a!==null&&a!==undefined){answered++;if(a===true)correct++;}
  });
});
return {correct,answered,total};
}

// ══ 青学換算：4年分の実問題から算出した難易度構成に基づく ══
// 2023〜2026の青学入試を全問精査し、各科目の難易度構成比を判定
// A=基礎 B=標準 C=応用 D=難問
const AOYAMA_CONV = {
  max: {math:100, japanese:100, science:50, social:50},
  total: 300,
  line: 183,
  label: {math:"算数", japanese:"国語", science:"理科", social:"社会"},
  color: {math:"#3b82f6", japanese:"#ec4899", science:"#22c55e", social:"#f59e0b"},
  // 実問題から判定した難易度構成（配点%）
  dist: {
    math:     {A:13, B:20, C:40, D:27},
    japanese: {A:25, B:40, C:25, D:10},
    science:  {A:30, B:35, C:25, D:10},
    social:   {A:35, B:40, C:20, D:5},
  },
  // 合格ライン61%到達に必要な科目別目安
  goal: {math:61, japanese:61, science:31, social:31},
  levelName: {A:"基礎", B:"標準", C:"応用", D:"難問"},
};
// 分位点マッチング：SAPIXの設問を易しい順に並べ、青学の難易度構成比で区切って換算
function convertToAoyama(test){
  if(!test||!test.qData) return null;
  const C=AOYAMA_CONV;
  const out={subjects:{}, total:0, ok:true};
  for(const s of ["math","japanese","science","social"]){
    const qs=[...(test.qData[s]||[])].sort((a,b)=>b[3]-a[3]); // 正答率が高い＝易しい順
    if(!qs.length){ out.subjects[s]={conv:null,bands:null}; out.ok=false; continue; }
    const totalPts=qs.reduce((a,q)=>a+q[1],0);
    const D=C.dist[s];
    const bA=D.A/100*totalPts, bB=(D.A+D.B)/100*totalPts, bC=(D.A+D.B+D.C)/100*totalPts;
    const got={A:0,B:0,C:0,D:0}, full={A:0,B:0,C:0,D:0};
    let acc=0;
    for(const q of qs){
      const lv = acc<bA?"A" : acc<bB?"B" : acc<bC?"C" : "D";
      full[lv]+=q[1];
      if(q[2]==="○") got[lv]+=q[1];
      acc+=q[1];
    }
    let conv=0; const bands={};
    for(const lv of ["A","B","C","D"]){
      const rate=full[lv]?got[lv]/full[lv]:0;
      const weight=D[lv]/100*C.max[s];
      conv+=rate*weight;
      bands[lv]={rate:Math.round(rate*100), pts:Math.round(rate*weight*10)/10, max:Math.round(weight*10)/10};
    }
    conv=Math.round(conv);
    out.subjects[s]={conv, bands};
    out.total+=conv;
  }
  out.gap=out.total-C.line;
  return out;
}

  japanese: {l:"国語",c:"#ef4444",i:"文"},
  science:  {l:"理科",c:"#22c55e",i:"⚗"},
  social:   {l:"社会",c:"#f59e0b",i:"🌏"},
};
const SUBJ_KEYS = ["math","japanese","science","social"];

// 全テストを日付降順（最新が先頭）
const allTests = [...IMPORTED_TESTS, ...(testScores||[])]
  .filter(t=>t&&t.date)
  .sort((a,b)=>(b.date||"").localeCompare(a.date||""));

// 最新ほど重い加重（半減期方式）: 最新=1.0, 1つ前=0.65, 2つ前=0.42 ...
const DECAY = 0.65;
const weightOf = (idx) => Math.pow(DECAY, idx);

// ── 加重平均の計算 ──
// 各テストの偏差値・得点率を、最新ほど重く平均する
const weightedSubj = (sid) => {
  let wsum=0, hsum=0, rsum=0, rw=0, latest=null, prev=null;
  allTests.forEach((t,idx)=>{
    const h=parseFloat(t[sid+"Hensachi"]);
    const sc=parseFloat(t[sid]);
    const mx=parseFloat(t[sid+"Max"]);
    const w=weightOf(idx);
    if(!isNaN(h)){ hsum+=h*w; wsum+=w; if(latest===null)latest=h; else if(prev===null)prev=h; }
    if(!isNaN(sc)&&!isNaN(mx)&&mx>0){ rsum+=(sc/mx*100)*w; rw+=w; }
  });
  return {
    hensachi: wsum>0?hsum/wsum:null,
    rate: rw>0?rsum/rw:null,
    latest, prev,
    trend: (latest!=null&&prev!=null)?latest-prev:null,
  };
};

// ── 易問分析の加重集計（qDataベース） ──
const weightedEasy = (sid) => {
  let lossSum=0, lw=0, pctSum=0, pw=0, latestLoss=null;
  allTests.forEach((t,idx)=>{
    if(!t.qData||!t.qData[sid]) return;
    const qs=t.qData[sid];
    if(!qs.length) return;
    const w=weightOf(idx);
    const loss=qs.filter(q=>q[2]==="×"&&q[3]>=60).reduce((a,q)=>a+q[1],0);
    const easy=qs.filter(q=>q[3]>=60);
    const eg=easy.filter(q=>q[2]==="○").reduce((a,q)=>a+q[1],0);
    const et=easy.reduce((a,q)=>a+q[1],0);
    lossSum+=loss*w; lw+=w;
    if(et>0){ pctSum+=(eg/et*100)*w; pw+=w; }
    if(latestLoss===null) latestLoss=loss;
  });
  return {loss: lw>0?lossSum/lw:null, easyPct: pw>0?pctSum/pw:null, latestLoss};
};

// ── 分野別の加重評価（weakFieldsベース） ──
const weightedFields = (sid) => {
  const map = {};
  allTests.forEach((t,idx)=>{
    const wf = t.weakFields && t.weakFields[sid];
    if(!Array.isArray(wf)) return;
    const w = weightOf(idx);
    wf.forEach(f=>{
      if(!f||!f.field) return;
      const key=f.field;
      if(!map[key]) map[key]={field:key, mySum:0, avgSum:0, wsum:0, count:0, latestNote:null, latestDate:null, latestMy:null, latestAvg:null};
      const m=map[key];
      const my = f.myRate!=null?f.myRate:(f.rate!=null?f.rate:null);
      const av = f.avgRate!=null?f.avgRate:null;
      if(my!=null){ m.mySum+=my*w; m.wsum+=w; }
      if(av!=null){ m.avgSum+=av*w; }
      m.count++;
      if(m.latestNote===null){ m.latestNote=f.note||null; m.latestDate=t.date; m.latestMy=my; m.latestAvg=av; }
    });
  });
  return Object.values(map).map(m=>{
    const my = m.wsum>0?m.mySum/m.wsum:null;
    const av = m.wsum>0?m.avgSum/m.wsum:null;
    let tag="ok";
    if(my==null) tag="nodata";
    else if(av!=null&&av>=60&&my<av) tag="weak_easy";
    else if(av!=null&&av>=40&&my<av-8) tag="weak_mid";
    else if(av!=null&&my>=av) tag="strong";
    else if(my>=60) tag="strong";
    else if(my<35) tag="weak";
    return {...m, my, av, tag};
  }).sort((a,b)=>{
    const ORD={weak_easy:0,weak:1,weak_mid:2,ok:3,strong:4,nodata:5};
    if(ORD[a.tag]!==ORD[b.tag]) return ORD[a.tag]-ORD[b.tag];
    return (a.my||0)-(b.my||0);
  });
};

  const ov = overrides[key(school.id,subjId)];
  if(ov==="on") return true;
  if(ov==="off") return false;
  return school.subjects.includes(subjId);
};

                  border:on?`1.5px solid ${G.color}55`:"1px solid rgba(255,255,255,.07)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <button onClick={()=>toggle(s.id)}
                      style={{flexShrink:0,width:22,height:22,borderRadius:6,cursor:"pointer",padding:0,
                        border:on?`1px solid ${G.color}`:"1px solid rgba(255,255,255,.25)",
                        background:on?`${G.color}33`:"transparent",color:G.color,fontSize:13,fontWeight:800}}>{on?"✓":""}</button>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                        <span style={{fontSize:12.5,fontWeight:700}}>{s.name}</span>
                        <span style={{fontSize:8.5,padding:"1px 5px",borderRadius:4,background:`${G.color}22`,color:G.color}}>{G.label}</span>
                        {s.affinity>=3&&<span style={{fontSize:8.5,padding:"1px 5px",borderRadius:4,background:"rgba(244,114,182,.2)",color:"#f472b6"}}>青学と相性◎</span>}
                      </div>
                      <div style={{fontSize:9,opacity:.5,marginTop:2}}>偏差値{s.hensachi}　{s.place}　{s.note}</div>
                    </div>
                    <div style={{flexShrink:0,textAlign:"right"}}>
                      <div style={{fontSize:15,fontWeight:900,fontFamily:"monospace",
                        color:prob>=60?"#4ade80":prob>=35?"#fbbf24":"#f87171"}}>{prob}%</div>
                    </div>
                  </div>
                  {on&&(
                    <div style={{display:"flex",gap:5,marginTop:7,paddingLeft:30}}>
                      <span style={{fontSize:9.5,opacity:.45,alignSelf:"center",marginRight:2}}>結果</span>
                      <button onClick={()=>setRes(s.id,"pass")}
                        style={{flex:1,background:r==="pass"?"rgba(74,222,128,.28)":"rgba(255,255,255,.05)",
                          border:r==="pass"?"1px solid rgba(74,222,128,.6)":"1px solid rgba(255,255,255,.1)",
                          color:r==="pass"?"#4ade80":"rgba(255,255,255,.45)",borderRadius:6,padding:"5px",fontSize:11,fontWeight:r==="pass"?800:400,cursor:"pointer",fontFamily:"inherit"}}>合格</button>
                      <button onClick={()=>setRes(s.id,"fail")}
                        style={{flex:1,background:r==="fail"?"rgba(248,113,113,.22)":"rgba(255,255,255,.05)",
                          border:r==="fail"?"1px solid rgba(248,113,113,.5)":"1px solid rgba(255,255,255,.1)",
                          color:r==="fail"?"#f87171":"rgba(255,255,255,.45)",borderRadius:6,padding:"5px",fontSize:11,fontWeight:r==="fail"?800:400,cursor:"pointer",fontFamily:"inherit"}}>不合格</button>
                      <button onClick={()=>setRes(s.id,null)}
                        style={{flex:.7,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",
                          color:"rgba(255,255,255,.3)",borderRadius:6,padding:"5px",fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>未定</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}

      {/* 注記 */}
      <div style={{padding:"10px 11px",borderRadius:10,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",marginTop:6}}>
        <div style={{fontSize:10,fontWeight:700,opacity:.7,marginBottom:5}}>合格可能性の目安について</div>
        <div style={{fontSize:9.5,opacity:.55,lineHeight:1.65}}>
          SAPIX偏差値の差から推定した参考値です。青学は基礎重視型で偏差値より過去問適合が効くため、
          実際の可能性は過去問の得点率で判断してください。「どこか1校に合格」は各校が独立と仮定した計算です。
        </div>
      </div>
    </div>
  );
}

// ── 年度別 過去問記録（青学・開智日本橋・開智） ──
if(view!=="list"&&YEARLY_SCHOOLS[view]){
  const CFG=YEARLY_SCHOOLS[view];
  const nowY=2026;
  const YEARS=Array.from({length:CFG.years},(_,i)=>nowY-i);
  const data=yearlyData[view]||{};
  const updMin=async(y,v)=>{
    const next={...yearlyData};
    const sd={...(next[view]||{})};
    sd[y]={...(sd[y]||{}),min:v};
    next[view]=sd;
    await saveYearly(next);
  };
  // 科目データ取得（新形式{max,scores} / 旧形式=数値 の両対応）
  const getSub=(y,sid)=>{
    const d=(data[y]||{})[sid];
    if(d===undefined||d==="") return null;
    if(typeof d==="object"){
      if(!d.scores&&Array.isArray(d.rows)) return {...d,scores:d.rows.map(r=>r.score)};
      return d;
    }
    return {max:(CFG.subj.find(s=>s.id===sid)||{}).max, scores:[String(d)]}; // 旧データ移行
  };
  const subTotal=(y,sid)=>{const d=getSub(y,sid);return d?(d.scores||[]).reduce((a,b)=>a+(parseFloat(b)||0),0):0;};
  const subBlank=(y,sid)=>{const d=getSub(y,sid);return d&&Array.isArray(d.rows)?d.rows.reduce((a,r)=>a+(parseInt(r.blank)||0),0):0;};
  const yMin=(y)=>{const d=data[y]||{};return d.min!==undefined&&d.min!==""?d.min:(CFG.officialMin[y]!==undefined?String(CFG.officialMin[y]):"");};
  const yTotal=(y)=>CFG.subj.reduce((a,s)=>a+subTotal(y,s.id),0);
  const yHasAny=(y)=>CFG.subj.some(s=>getSub(y,s.id)!==null);
  const fullMax=CFG.subj.reduce((a,s)=>{const d=getSub(0,s.id);return a+s.max;},0);
  const doneY=YEARS.filter(y=>yHasAny(y)).length;
  const openYearEdit=(y,sid)=>{
    const d=getSub(y,sid);
    const def=CFG.subj.find(s=>s.id===sid);
    let rows;
    if(d&&Array.isArray(d.rows)&&d.rows.length){
      rows=d.rows.map(r=>({label:r.label||"",score:r.score??"",max:r.max??"",blank:r.blank??"",reason:r.reason||""}));
    }else if(d&&Array.isArray(d.scores)&&d.scores.length){
      rows=d.scores.map((s,i)=>({label:`大問${i+1}`,score:s,max:"",blank:"",reason:""}));
    }else{
      const tpl=(view==="aoyama"&&AOYAMA_TEMPLATES[y]&&AOYAMA_TEMPLATES[y][sid])||null;
      if(tpl){
        const per=tpl.max/tpl.sections.reduce((a,s)=>a+s.items,0);
        rows=tpl.sections.map(s=>({label:`${s.n}. ${s.label}`,score:"",max:s.pts!==undefined?String(s.pts):String(Math.round(per*s.items*10)/10),blank:"",reason:""}));
      }else{
        rows=[{label:"大問1",score:"",max:"",blank:"",reason:""},{label:"大問2",score:"",max:"",blank:"",reason:""}];
      }
    }
    setEditYear({schoolId:view, year:y, subjId:sid,
      max: d?String(d.max):String(def.max),
      time: d&&d.time!==undefined?String(d.time):"",
      rows});
  };
  return (
    <div style={{padding:"12px 12px 90px"}}>
      <button onClick={()=>setView("list")} style={{background:"none",border:"none",color:"#93c5fd",fontSize:13,cursor:"pointer",padding:"6px 0",marginBottom:8}}>← 有名中一覧にもどる</button>
      <div style={{fontSize:17,fontWeight:800,color:CFG.color,marginBottom:2}}>{view==="aoyama"?"★ ":""}{CFG.name} 過去問記録</div>
      <div style={{fontSize:11,opacity:.5,marginBottom:12}}>
        過去{CFG.years}年分／科目をタップして大問ごとの得点・満点を登録
      </div>

      <div style={{padding:"10px",borderRadius:10,background:`${CFG.color}1f`,border:`1px solid ${CFG.color}4d`,textAlign:"center",marginBottom:12}}>
        <div style={{fontSize:10,opacity:.6}}>入力済み年度</div>
        <div style={{fontSize:22,fontWeight:900,fontFamily:"monospace",color:CFG.color}}>{doneY}<span style={{fontSize:12,opacity:.6}}>/{CFG.years}年</span></div>
      </div>

      {/* ══ 過去問分析（入力済みが1年以上あれば表示） ══ */}
      {doneY>0&&(()=>{
        const doneYears=YEARS.filter(y=>yHasAny(y)).sort((a,b)=>a-b); // 古→新
        const SUBJ_C={math:"#3b82f6",japanese:"#ec4899",science:"#22c55e",social:"#f59e0b"};
        // 年度ごとの合計・最低点・空白
        const yearStats=doneYears.map(y=>{
          const tot=yTotal(y); const mn=parseFloat(yMin(y));
          const blank=CFG.subj.reduce((a,s)=>a+subBlank(y,s.id),0);
          const mx=CFG.subj.reduce((a,s)=>{const d=getSub(y,s.id);return a+(d?(parseFloat(d.max)||0):s.max);},0);
          return {y,tot,mn:isNaN(mn)?null:mn,blank,mx,rate:mx?tot/mx*100:0};
        });
        // 失点理由の集計（科目別）
        const reasonBySubj={};
        CFG.subj.forEach(s=>{
          const cnt={};
          doneYears.forEach(y=>{const d=getSub(y,s.id);if(d&&Array.isArray(d.rows))d.rows.forEach(r=>{
            const lost=(parseFloat(r.max)||0)-(parseFloat(r.score)||0);
            if(r.reason&&lost>0){cnt[r.reason]=(cnt[r.reason]||0)+lost;}
          });});
          reasonBySubj[s.id]=cnt;
        });
        // 合格ライン予測（直近の得点率推移から線形外挿）
        const lastMin=(()=>{for(let i=yearStats.length-1;i>=0;i--)if(yearStats[i].mn!=null)return yearStats[i].mn;return CFG.officialMin[2026]||null;})();
        const latest=yearStats[yearStats.length-1];
        const gap=lastMin!=null?latest.tot-lastMin:null;
        // 全期間の傾き
        let trend=null;
        if(yearStats.length>=2){
          const a=yearStats[0],b=yearStats[yearStats.length-1];
          trend=(b.tot-a.tot)/(yearStats.length-1);
        }
        const H=(v,c)=><span style={{fontFamily:"monospace",fontWeight:800,color:c}}>{v}</span>;
        return (
          <div style={{marginBottom:14}}>
            {/* 合格ラインまでの距離 */}
            <div style={{padding:"12px 13px",borderRadius:12,marginBottom:10,
              background:gap==null?"rgba(255,255,255,.04)":gap>=0?"rgba(34,197,94,.12)":"rgba(239,68,68,.10)",
              border:`1px solid ${gap==null?"rgba(255,255,255,.1)":gap>=0?"rgba(74,222,128,.4)":"rgba(248,113,113,.35)"}`}}>
              <div style={{fontSize:10.5,opacity:.6,marginBottom:2}}>最新（{latest.y}年度）合格ラインまで</div>
              <div style={{fontSize:30,fontWeight:900,fontFamily:"monospace",color:gap==null?"rgba(255,255,255,.5)":gap>=0?"#4ade80":"#f87171"}}>
                {gap==null?"—":(gap>=0?"+":"")+gap}<span style={{fontSize:13,marginLeft:4}}>点</span>
              </div>
              <div style={{fontSize:11,opacity:.65,marginTop:2}}>
                {latest.tot}点 / 最低点{lastMin!=null?lastMin:"未設定"}　得点率{Math.round(latest.rate)}%　空白{latest.blank}問
              </div>
              {trend!=null&&yearStats.length>=2&&(
                <div style={{fontSize:10,opacity:.55,marginTop:5}}>
                  1年度あたり {trend>=0?"+":""}{trend.toFixed(1)}点ペース
                  {gap!=null&&gap<0&&trend>0&&<span>　→ あと約{Math.ceil(-gap/trend)}回分で到達見込み</span>}
                </div>
              )}
            </div>

            {/* 年度別 推移（合計・空白） */}
            <div style={{padding:"10px 11px",borderRadius:10,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",marginBottom:10}}>
              <div style={{fontSize:11,fontWeight:700,opacity:.75,marginBottom:6}}>📈 年度別の推移</div>
              {yearStats.map(s=>{
                const ok=s.mn!=null&&s.tot>=s.mn;
                return (
                  <div key={s.y} style={{display:"flex",alignItems:"center",gap:8,marginBottom:5,fontSize:11}}>
                    <span style={{width:34,opacity:.7,fontWeight:700}}>{s.y}</span>
                    <div style={{flex:1,height:7,borderRadius:4,background:"rgba(255,255,255,.08)",position:"relative",overflow:"hidden"}}>
                      <div style={{width:`${Math.min(100,s.rate)}%`,height:"100%",background:ok?"#4ade80":s.mn==null?"#60a5fa":"#f87171",borderRadius:4}}/>
                      {s.mn!=null&&s.mx>0&&<div style={{position:"absolute",left:`${Math.min(100,s.mn/s.mx*100)}%`,top:-2,width:2,height:11,background:"rgba(255,255,255,.8)"}}/>}
                    </div>
                    <span style={{width:58,textAlign:"right",fontFamily:"monospace",fontWeight:700,color:ok?"#4ade80":s.mn==null?"rgba(255,255,255,.7)":"#f87171"}}>{s.tot}<span style={{fontSize:9,opacity:.6}}>/{s.mx}</span></span>
                    <span style={{width:40,textAlign:"right",fontSize:9.5,color:s.blank>0?"#fbbf24":"rgba(255,255,255,.35)"}}>空{s.blank}</span>
                  </div>
                );
              })}
              <div style={{fontSize:9,opacity:.4,marginTop:3}}>白線＝合格最低点の位置</div>
            </div>

            {/* 科目×年度 ヒートマップ */}
            <div style={{padding:"10px 11px",borderRadius:10,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",marginBottom:10}}>
              <div style={{fontSize:11,fontWeight:700,opacity:.75,marginBottom:6}}>🔥 科目×年度 得点率ヒートマップ</div>
              <div style={{display:"grid",gridTemplateColumns:`34px repeat(${CFG.subj.length},1fr)`,gap:3,fontSize:10}}>
                <div/>
                {CFG.subj.map(s=><div key={s.id} style={{textAlign:"center",fontWeight:700,color:SUBJ_C[s.id]}}>{s.label}</div>)}
                {doneYears.map(y=>(
                  <React.Fragment key={y}>
                    <div style={{opacity:.7,fontWeight:700,alignSelf:"center"}}>{y}</div>
                    {CFG.subj.map(s=>{
                      const d=getSub(y,s.id);
                      if(!d) return <div key={s.id} style={{height:26,borderRadius:5,background:"rgba(255,255,255,.03)"}}/>;
                      const st=subTotal(y,s.id); const smx=parseFloat(d.max)||s.max; const r=smx?st/smx:0;
                      const bg=r>=0.7?"rgba(74,222,128,.55)":r>=0.55?"rgba(163,230,53,.45)":r>=0.4?"rgba(251,191,36,.45)":"rgba(248,113,113,.5)";
                      return <div key={s.id} style={{height:26,borderRadius:5,background:bg,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"monospace",fontWeight:800,fontSize:10.5}}>{Math.round(r*100)}%</div>;
                    })}
                  </React.Fragment>
                ))}
              </div>
              <div style={{fontSize:9,opacity:.4,marginTop:4}}>緑≥70% ／ 黄緑≥55% ／ 黄≥40% ／ 赤&lt;40%</div>
            </div>

            {/* 失点の型 */}
            {(()=>{
              const any=Object.values(reasonBySubj).some(c=>Object.keys(c).length);
              if(!any) return null;
              return (
                <div style={{padding:"10px 11px",borderRadius:10,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:700,opacity:.75,marginBottom:6}}>🧭 失点の型（科目別・失点の内訳）</div>
                  {CFG.subj.map(s=>{
                    const cnt=reasonBySubj[s.id]; const total=Object.values(cnt).reduce((a,b)=>a+b,0);
                    if(!total) return null;
                    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
                    return (
                      <div key={s.id} style={{marginBottom:7}}>
                        <div style={{display:"flex",justifyContent:"space-between",fontSize:10.5,marginBottom:3}}>
                          <span style={{fontWeight:700,color:SUBJ_C[s.id]}}>{s.label}</span>
                          <span style={{opacity:.55}}>失点 {Math.round(total)}点</span>
                        </div>
                        <div style={{display:"flex",height:9,borderRadius:5,overflow:"hidden",background:"rgba(255,255,255,.06)"}}>
                          {top.map(([rid,v])=>{const L=LOSS_REASONS.find(x=>x.id===rid);return <div key={rid} style={{width:`${v/total*100}%`,background:L?L.color:"#888"}}/>;})}
                        </div>
                        <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:3}}>
                          {top.map(([rid,v])=>{const L=LOSS_REASONS.find(x=>x.id===rid);return <span key={rid} style={{fontSize:9,color:L?L.color:"#ccc"}}>● {L?L.label:rid} {Math.round(v/total*100)}%</span>;})}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}

            {/* ① 型別の正答率（青学のみ） */}
            {view==="aoyama"&&(()=>{
              const classify=(label,idx,total)=>{
                const L=label||"";
                if(/四則|逆算/.test(L)) return "calc";
                if(/図形|角度|面積/.test(L)) return "fig";
                if(/\(1\)\(2\)|\(1\)〜|水の深さ|グラフ|水そう/.test(L)||idx>=total-2) return "fusion";
                return "line";
              };
              const TYPES=[
                {id:"calc",label:"計算（大問1・2）",color:"#60a5fa",goal:100,note:"落とせない12点"},
                {id:"line",label:"一行問題（大問3〜9）",color:"#4ade80",goal:80,note:"合否を分ける約42点"},
                {id:"fig",label:"図形（角度・面積）",color:"#fbbf24",goal:70,note:"角度は毎年必出"},
                {id:"fusion",label:"融合・難問（大問12〜14）",color:"#f87171",goal:30,note:"(1)だけ拾えば十分"},
              ];
              const agg={calc:{s:0,m:0},line:{s:0,m:0},fig:{s:0,m:0},fusion:{s:0,m:0}};
              const byYear={};
              doneYears.forEach(y=>{
                const d=getSub(y,"math"); if(!d||!Array.isArray(d.rows)) return;
                const n=d.rows.length;
                byYear[y]={calc:{s:0,m:0},line:{s:0,m:0},fig:{s:0,m:0},fusion:{s:0,m:0}};
                d.rows.forEach((r,i)=>{
                  const t=classify(r.label,i,n); const s=parseFloat(r.score)||0; const m=parseFloat(r.max)||0;
                  agg[t].s+=s; agg[t].m+=m; byYear[y][t].s+=s; byYear[y][t].m+=m;
                });
              });
              const anyMath=Object.values(agg).some(a=>a.m>0);
              if(!anyMath) return null;
              return (
                <div style={{padding:"10px 11px",borderRadius:10,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:700,opacity:.75,marginBottom:6}}>🧩 算数・型別の正答率（合格ラインへの近道）</div>
                  {TYPES.map(t=>{
                    const a=agg[t.id]; if(!a.m) return null;
                    const pct=Math.round(a.s/a.m*100); const ok=pct>=t.goal;
                    return (
                      <div key={t.id} style={{marginBottom:7}}>
                        <div style={{display:"flex",justifyContent:"space-between",fontSize:10.5,marginBottom:3}}>
                          <span style={{fontWeight:700,color:t.color}}>{t.label}</span>
                          <span style={{fontFamily:"monospace",fontWeight:800,color:ok?"#4ade80":"#f87171"}}>{pct}%<span style={{opacity:.5,fontWeight:400,fontSize:9}}> /目標{t.goal}%</span></span>
                        </div>
                        <div style={{height:7,borderRadius:4,background:"rgba(255,255,255,.08)",position:"relative",overflow:"hidden"}}>
                          <div style={{width:`${pct}%`,height:"100%",background:t.color,borderRadius:4}}/>
                          <div style={{position:"absolute",left:`${t.goal}%`,top:-2,width:2,height:11,background:"rgba(255,255,255,.7)"}}/>
                        </div>
                        <div style={{fontSize:9,opacity:.5,marginTop:2}}>{t.note}　{Math.round(a.s)}/{Math.round(a.m)}点</div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}

            {/* ② 詩トラッカー（青学のみ） */}
            {view==="aoyama"&&(()=>{
              const poems=doneYears.map(y=>{
                const d=getSub(y,"japanese"); if(!d||!Array.isArray(d.rows)) return null;
                const r=d.rows.find(x=>/詩/.test(x.label||"")); if(!r) return null;
                return {y,s:parseFloat(r.score)||0,m:parseFloat(r.max)||0};
              }).filter(Boolean);
              if(!poems.length) return null;
              const latest=poems[poems.length-1];
              return (
                <div style={{padding:"10px 11px",borderRadius:10,background:"rgba(236,72,153,.08)",border:"1px solid rgba(244,114,182,.3)",marginBottom:10}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#f9a8d4",marginBottom:4}}>📝 詩トラッカー（国語・大問二）</div>
                  <div style={{fontSize:9.5,opacity:.6,marginBottom:6}}>毎年必出・塾で扱われにくい分野。対策の有無がそのまま点差に。</div>
                  <div style={{display:"flex",gap:6,alignItems:"flex-end",flexWrap:"wrap"}}>
                    {poems.map(p=>{
                      const pct=p.m?Math.round(p.s/p.m*100):0;
                      return (
                        <div key={p.y} style={{textAlign:"center",minWidth:48}}>
                          <div style={{height:44,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
                            <div style={{width:26,height:`${Math.max(4,pct*0.44)}px`,borderRadius:4,background:pct>=60?"#4ade80":pct>=35?"#fbbf24":"#f87171"}}/>
                          </div>
                          <div style={{fontSize:10,fontFamily:"monospace",fontWeight:800}}>{p.s}/{p.m}</div>
                          <div style={{fontSize:8.5,opacity:.5}}>{p.y}</div>
                        </div>
                      );
                    })}
                  </div>
                  <div style={{fontSize:9.5,marginTop:6,color:"#fbbf24"}}>
                    直近 {latest.y}年度：{latest.m?Math.round(latest.s/latest.m*100):0}%　→ 目標60%（{Math.round(latest.m*0.6)}点）
                  </div>
                </div>
              );
            })()}
          </div>
        );
      })()}

          <div style={{marginBottom:12,borderRadius:11,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",overflow:"hidden"}}>

              background:"none",border:"none",color:"white",padding:"10px 11px",cursor:"pointer",fontFamily:"inherit"}}>
              <span style={{fontSize:11.5,fontWeight:700,opacity:.85}}>📚 出題傾向（2021〜2026の実データ）</span>
              <span style={{fontSize:11,opacity:.5}}>{open?"▲":"▼"}</span>
            </button>
            {open&&(
              <div style={{padding:"0 11px 11px"}}>
                <div style={{display:"flex",gap:5,marginBottom:8}}>
                  {Object.keys(SUBJ_L).map(sid=>(
                    <button key={sid} onClick={()=>setTrendSubj(sid)}
                      style={{flex:1,background:trendSubj===sid?`${SUBJ_C[sid]}30`:"rgba(255,255,255,.05)",
                        border:trendSubj===sid?`1px solid ${SUBJ_C[sid]}80`:"1px solid rgba(255,255,255,.1)",

                        fontSize:11,fontWeight:trendSubj===sid?800:500,cursor:"pointer",fontFamily:"inherit"}}>{SUBJ_L[sid]}</button>
                  ))}

                {(AOYAMA_TRENDS[trendSubj]||[]).map((t,i)=>{
                  const freq=t.years.length;
                  return (
                    <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,.05)"}}>

                        <div style={{fontSize:16,fontWeight:900,fontFamily:"monospace",color:freq>=5?"#f87171":freq>=3?"#fbbf24":"rgba(255,255,255,.6)"}}>{freq}<span style={{fontSize:9}}>/5</span></div>

                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:12,fontWeight:700}}>{t.unit}</div>
                        <div style={{fontSize:9.5,opacity:.6,marginTop:2,lineHeight:1.5}}>{t.note}</div>
                        <div style={{display:"flex",gap:3,marginTop:4}}>

      {/* ══ 時事・科学常識メモ（青学のみ） ══ */}
      {view==="aoyama"&&(()=>{
        const all=[...AOYAMA_JIJI_SEED,...(jijiState.custom||[])];
        const list=all.filter(x=>jijiTab==="all"?true:x.cat===jijiTab);
        const checked=jijiState.checked||{};
        const doneCnt=all.filter(x=>x.cat==="next"&&checked[x.id]).length;
        const nextCnt=all.filter(x=>x.cat==="next").length;
        const toggle=(id)=>saveJiji({...jijiState,checked:{...checked,[id]:!checked[id]}});
        const addCustom=()=>{
          const t=jijiInput.trim(); if(!t) return;
          const item={id:"c"+Date.now(),cat:"next",year:2027,subj:"",text:t,note:"追加",custom:true};
          saveJiji({...jijiState,custom:[...(jijiState.custom||[]),item]}); setJijiInput("");
        };
        const delCustom=(id)=>saveJiji({...jijiState,custom:(jijiState.custom||[]).filter(x=>x.id!==id)});
